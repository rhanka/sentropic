server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # SPA fallback: renvoie /index.html sur 404 tout en conservant le code 404
    error_page 404 /index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SG0-app enrollment host (A-LIVE W1). GitHub callbacks carry one-time
    # ?code=, ?state= and installation_id values in the query string, so these
    # requests never enter the access log, and proxy errors (which echo the
    # request line) are kept out of the error log too. Regex locations match in
    # order: this one must stay above the generic /api/v1/ location.
    location ~ "^/api/v1/github-app(/|$)" {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Builder host build API (A-LIVE W7). Same treatment as the SG0-app host:
    # host-to-builder job requests never enter the access log, and proxy errors
    # (which echo the request line) stay out of the error log. Regex locations
    # match in order: this one must stay above the generic /api/v1/ location.
    location ~ "^/api/v1/artifacts/builder(/|$)" {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RFC 9728 Protected Resource Metadata. The 401 challenge of the MCP resource server
    # advertises /.well-known/oauth-protected-resource<resource-path> at the HOST ROOT, where
    # this nginx otherwise answers with the SPA. The API serves the document under its own
    # mount, so the path is rewritten (the document is the same for every suffix: one
    # resource). Same X-Forwarded-* provenance as /api/v1/ so TRUSTED_PROXY_HOPS=1 holds;
    # never route this path straight from the ingress to the API (spoofable XFF).
    location ~ "^/\.well-known/oauth-protected-resource(/.*)?$" {
        limit_except GET HEAD OPTIONS { deny all; }
        rewrite ^ /api/v1/mcp/.well-known/oauth-protected-resource break;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location ~  "^/api/v1/.*" {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Client IP provenance. Without these the API receives whatever
        # X-Forwarded-For the CALLER chose to send, which makes every IP-keyed
        # control (rate limiting, anonymous quotas, session audit) bypassable.
        # $proxy_add_x_forwarded_for APPENDS the peer we actually saw, so the
        # rightmost entry is trustworthy; the API reads it via TRUSTED_PROXY_HOPS.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headers CORS pour l'API
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

}
