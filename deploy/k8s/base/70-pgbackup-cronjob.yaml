# BR-37c Lot 1 — nightly Postgres backup to SCW Object Storage.
# initContainer dumps with pg_dump (postgres:17-alpine, matches the tenant DB),
# main container uploads the gzip dump to s3://$S3_BUCKET/pg/<ts>.sql.gz via aws-cli.
# Bucket name comes from the sentropic-pgbackup SealedSecret (S3_BUCKET), not hardcoded.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pgbackup
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: pgbackup
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sentropic
            app.kubernetes.io/component: pgbackup
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: dump
              image: postgres:17-alpine
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  echo "dumping app DB at $ts"
                  # dump to a file (not piped) so a pg_dump failure fails the container
                  # instead of being masked by a succeeding gzip on empty input.
                  pg_dump --no-owner --no-privileges > "/work/${ts}.sql"
                  test -s "/work/${ts}.sql"
                  gzip -9 "/work/${ts}.sql"
                  echo "$ts" > /work/ts
                  ls -lh /work
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: app
                - name: PGDATABASE
                  value: app
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sentropic-postgres
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: amazon/aws-cli:2.34.53
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts="$(cat /work/ts)"
                  echo "uploading ${ts}.sql.gz to s3://${S3_BUCKET}/pg/"
                  aws s3 cp "/work/${ts}.sql.gz" "s3://${S3_BUCKET}/pg/${ts}.sql.gz" \
                    --endpoint-url "${S3_ENDPOINT}" --region "${S3_REGION}"
                  echo "backup uploaded"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: sentropic-pgbackup
                      key: S3_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sentropic-pgbackup
                      key: S3_SECRET_KEY
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: sentropic-pgbackup
                      key: S3_BUCKET
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: sentropic-pgbackup
                      key: S3_REGION
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: sentropic-pgbackup
                      key: S3_ENDPOINT
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
