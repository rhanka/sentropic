apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-content
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: artifact-content
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8791
  # Object-store destinations require the tenant's reviewed egress/IAM receipt.
  # Until then storage stays unreachable even if a runtime flag is misconfigured.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentropic
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-artifact-content-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentropic
              app.kubernetes.io/component: artifact-content
      ports:
        - protocol: TCP
          port: 5432
