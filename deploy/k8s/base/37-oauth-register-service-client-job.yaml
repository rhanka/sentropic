# Versioned one-off Job for governed client_credentials SERVICE client provisioning.
#
# Runs `node dist/scripts/oauth-register-service-client.js` (compiled into the api image by
# `api/package.json` build) AGAINST the tier database: one `service_clients` row (sha256
# secret hash, explicit scopes, resource indicators, no exchange policy) plus its CM tenant
# binding, in one serializable write. Idempotent; widen, downgrade and secret rotation each
# need an explicit flag. Procedure and 90-day cycle: docs/secrets.md.
#
# Apply ONE-OFF per registration (never added to kustomization resources), through the
# governed wrapper only:
#   make oauth-register-service-client-job SECRET_FILE=<0600 env file> \
#     OAUTH_SERVICE_CLIENT_JOB_NAMESPACE=<ns> KUBECONFIG=<0600 kubeconfig> ENV=<env>
# The wrapper pins the image to the namespace's running `api` Deployment image (the script
# then matches that tier's schema), waits, prints the log, and deletes the Job and the
# temporary Secret on exit, even on failure.
#
# Network: the baseline is default-deny-ingress, so
# `allow-oauth-register-service-client-to-postgres` (15-networkpolicy.yaml) admits this
# Job's pod to postgres:5432. Without it the provisioning fails closed.
#
# Secrets reach the Job ONLY via `envFrom` — never as CLI literals:
# - ConfigMap `api`: AUTH_CALLBACK_BASE_URL / OAUTH_SERVICE_RESOURCE_URI (default resource).
# - Secret `sentropic-api`: tier DB and shared IdP config (reused, operator-owned).
# - Secret `oauth-service-client-registration`: TEMPORARY per-run Secret created from the
#   operator 0600 env file, holding ONLY OAUTH_SERVICE_CLIENT_* variables (the wrapper
#   refuses any other key, so the file cannot redirect DATABASE_URL).
apiVersion: batch/v1
kind: Job
metadata:
  name: oauth-register-service-client
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: oauth-register-service-client
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentropic
        app.kubernetes.io/component: oauth-register-service-client
    spec:
      # enableServiceLinks:false — same pinned rationale as 30-api.yaml: k8s
      # service env injection shadows app port envs.
      enableServiceLinks: false
      serviceAccountName: sentropic-app
      automountServiceAccountToken: false
      restartPolicy: Never
      # No runAsNonRoot: the api image has no USER stanza (runs as root), so a
      # non-root constraint would break the Job. seccomp default still applies.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: ghcr.io/rhanka/sentropic-api:main
          imagePullPolicy: Always
          workingDir: /workspace/api
          command: ["node", "dist/scripts/oauth-register-service-client.js"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: api
            - secretRef:
                name: sentropic-api
            - secretRef:
                name: oauth-service-client-registration
          resources:
            # Thin one-shot (mirrors 36-oauth-register-client sizing): connect+upsert+exit.
            requests:
              cpu: 60m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 320Mi
