apiVersion: v1
kind: ConfigMap
metadata:
  name: api
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
data:
  NODE_ENV: "production"
  PORT: "8787"
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  CHAT_TRACE_ENABLED: "true"
  CHAT_TRACE_RETENTION_DAYS: "7"
  DISABLE_AUTH: "0"
  # Outbound email via Scaleway TEM HTTP API (BR-37b; SMTP egress blocked at platform level).
  # SCW_TEM_SECRET_KEY is provided by the sentropic-api SealedSecret; these are non-secret config.
  SCW_TEM_API_BASE_URL: "https://api.scaleway.com"
  SCW_TEM_REGION: "fr-par"
  SCW_TEM_PROJECT_ID: "09ac728a-e3b9-4a5b-9749-664b0f147c70"
  SCW_TEM_FROM_EMAIL: "no-reply@sent-tech.ca"
  SCW_TEM_FROM_NAME: "Sentropic"
  # WebAuthn/passkey: RP ID is the PARENT registrable domain (sent-tech.ca), not the
  # specific subdomain, so passkeys stay portable across every *.sent-tech.ca origin
  # and survive a future hostname/rebrand change (a passkey is bound to its RP ID; a
  # subdomain RP ID would break on any domain move). Origin stays the exact serving URL.
  WEBAUTHN_RP_ID: "sent-tech.ca"
  WEBAUTHN_RP_NAME: "Sentropic"
  WEBAUTHN_ORIGIN: "https://sentropic.sent-tech.ca"
  # Public base URL for magic-link login emails (auth/magic-link.ts, else defaults to
  # http://localhost:5173) and for the POST-OAuth app RETURN url
  # (`resolveGoogleDriveAppReturnBaseUrl`, google-drive-oauth.ts:190). Must be the public host.
  #
  # It is NOT the Google OAuth `redirect_uri` base, contrary to what this comment claimed until now
  # (and to the copy of it that had been carried into the preprod overlay). `resolveCallbackBaseUrl`
  # (google-drive-oauth.ts:158) never reads this key — see the next one.
  AUTH_CALLBACK_BASE_URL: "https://sentropic.sent-tech.ca"
  # The Google OAuth `redirect_uri` base, for BOTH connectors: Gmail resolves it through the same
  # function (gmail-oauth.ts:29 reuses `resolveCallbackBaseUrl`), so this one key fixes
  # `<base>/api/v1/google-drive/oauth/callback` and `<base>/api/v1/gmail/oauth/callback`. Both must
  # be registered verbatim on the Google OAuth client — redirect matching is exact-string.
  #
  # Declared rather than derived, like every other host-shaped value here. Unset, the chain falls
  # through to its last candidate, the REQUEST origin (`x-forwarded-host`, gmail.ts:49), which
  # yields the right host behind the ingress but is not a property of the deployment: a call
  # arriving without that header builds a redirect_uri Google has never seen, and the resulting
  # `redirect_uri_mismatch` sends the investigation to the Console instead of here.
  GOOGLE_DRIVE_AUTH_CALLBACK_BASE_URL: "https://sentropic.sent-tech.ca"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8787
      targetPort: 8787
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentropic
        app.kubernetes.io/component: api
    spec:
      # enableServiceLinks:false — k8s default (true) injects <SVC>_PORT=tcp://<ip>:<port>
      # env vars for every Service, which shadow app port envs. mcp-auth 0.2.0 then builds
      # `new URL('http://localhost:tcp://10.32.10.123:8787/api/v1/mcp')` (Invalid URL) at api
      # boot -> CrashLoopBackOff. Regression P0 2026-07-02 (api down 15h). Keep this pinned so
      # `kubectl apply -k` never re-enables service-links. (Also fix mcp-auth to derive the MCP
      # resource base from AUTH_CALLBACK_BASE_URL, not a shadowable port env — follow-up B.)
      enableServiceLinks: false
      serviceAccountName: sentropic-app
      containers:
        - name: api
          image: rg.fr-par.scw.cloud/nc-reg/sentropic-api:main
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: api
            - secretRef:
                name: sentropic-api
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
