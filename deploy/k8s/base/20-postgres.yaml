apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: postgres
data:
  POSTGRES_DB: "app"
  POSTGRES_USER: "app"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentropic
        app.kubernetes.io/component: postgres
    spec:
      serviceAccountName: sentropic-app
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: postgres
            - secretRef:
                name: sentropic-postgres
          ports:
            - name: pg
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  # No storageClassName: the cluster's default StorageClass binds the PVC. The
  # base is shared by every tier and the tiers no longer live on the same cloud
  # (preprod moved to OVH on 2026-07-28), so a hardcoded provider class —
  # previously `scw-bssd` — pins the base to one provider and makes the manifest
  # unappliable everywhere else. `volumeClaimTemplates` is immutable on a live
  # StatefulSet, so a mismatch is not a warning: every `kubectl apply -k` fails
  # with "updates to statefulset spec ... are forbidden" and the whole CD stalls.
  # A tier that genuinely needs a specific class patches it in its own overlay.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
