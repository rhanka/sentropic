# Tenant provisions custody and qualified budgets before the authorized API boot.
# The fenced wire applies this same file to the live legacy template (T3 P-0.8), so it restates
# the base env entries in rendered order: the wired template then equals the rendered one and the
# later overlay apply starts no rollout. t3-template-diff.selftest.mjs refuses a restated entry that
# differs from the base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: api
          command: ["node", "/run/cm-runtime/launch.mjs"]
          env:
            - name: CM_A4_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: CM_IDENTITY_CUTOVER_IDP_RP_ID
              valueFrom:
                configMapKeyRef: { name: auth-idp, key: WEBAUTHN_RP_ID }
            - name: EMAIL_CODE_HMAC_KEY_ACTIVE
              valueFrom:
                secretKeyRef: { name: email-code-hmac, key: EMAIL_CODE_HMAC_KEY_ACTIVE }
            - name: EMAIL_CODE_HMAC_KEY_ACTIVE_REF
              valueFrom:
                secretKeyRef: { name: email-code-hmac, key: EMAIL_CODE_HMAC_KEY_ACTIVE_REF }
            - name: EMAIL_CODE_HMAC_KEY_PREVIOUS
              valueFrom:
                secretKeyRef: { name: email-code-hmac, key: EMAIL_CODE_HMAC_KEY_PREVIOUS, optional: true }
            - name: EMAIL_CODE_HMAC_KEY_PREVIOUS_REF
              valueFrom:
                secretKeyRef: { name: email-code-hmac, key: EMAIL_CODE_HMAC_KEY_PREVIOUS_REF, optional: true }
            - name: CM_IDENTITY_DELETION_BUDGETS_JSON
              valueFrom:
                secretKeyRef: { name: sentropic-identity-budgets, key: CM_IDENTITY_DELETION_BUDGETS_JSON }
            # Base entries (deploy/k8s/base/30-api.yaml), restated for the legacy template.
            - name: JEV_API_KEY
              valueFrom:
                secretKeyRef: { name: sentropic-api, key: JEV_API_KEY, optional: true }
            - name: DECISION_EXECUTION_PROFILE
              valueFrom:
                secretKeyRef: { name: sentropic-api, key: DECISION_EXECUTION_PROFILE, optional: true }
            - name: REMOTE_ACTION_ROLE
              value: product
            - name: APP_ARTIFACT_HOST_ENABLED
              value: "0"
            - name: APP_ARTIFACT_CONTENT_ENABLED
              value: "0"
            - name: APP_ARTIFACT_READER_ENABLED
              value: "0"
          volumeMounts:
            - { name: cm-cutover, mountPath: /run/cm-cutover, readOnly: true }
            - { name: cm-runtime, mountPath: /run/cm-runtime, readOnly: true }
      volumes:
        - name: cm-cutover
          persistentVolumeClaim: { claimName: sentropic-a4-custody, readOnly: true }
        - name: cm-runtime
          configMap: { name: sentropic-a4-runtime, defaultMode: 0444 }
