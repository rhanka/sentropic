apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# A4 identity runtime wiring shared by every tier (overlays/preprod-a4, overlays/prod-a4) and by
# the fenced `wire` operation (deploy/ci/preprod-a4/ops.mjs), which applies these same files.
# The launcher binds the email-code HMAC key ring to the pod namespace (CM_A4_NAMESPACE).
patches:
  - path: patch-api-config.yaml
  - path: patch-auth-idp-config.yaml
  - path: patch-api-a4.yaml
  - path: patch-auth-idp-a4.yaml
