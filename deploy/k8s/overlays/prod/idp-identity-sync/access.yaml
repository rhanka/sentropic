apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentropic-idp-export
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-idp-export-to-postgres
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: sentropic, app.kubernetes.io/component: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: idp-identity-export } }
      ports: [{ protocol: TCP, port: 5432 }]
---
# Immo/geo narrow trigger: it observes Jobs and flips the named CronJob's suspend.
# The k8s-owned admission policy is verified by CD before this delegation is armed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentropic-ci-trigger-idp-export
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentropic-ci-trigger-idp-export
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "patch"]
    resourceNames: ["sentropic-idp-identity-export"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentropic-ci-trigger-idp-export
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sentropic-ci-trigger-idp-export }
subjects: [{ kind: ServiceAccount, name: sentropic-ci-trigger-idp-export, namespace: sentropic }]
