apiVersion: batch/v1
kind: CronJob
metadata:
  name: sentropic-idp-identity-export
spec:
  schedule: "*/5 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: { app.kubernetes.io/name: sentropic, app.kubernetes.io/component: idp-identity-export }
        spec:
          serviceAccountName: sentropic-idp-export
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: work, emptyDir: { medium: Memory, sizeLimit: 32Mi } }
            - { name: sql, configMap: { name: sentropic-idp-identity-export-sql } }
          initContainers:
            - name: export
              image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
              workingDir: /work
              command: ["sh", "/sql/export-prod.sh"]
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGDATABASE, value: app }
                - { name: PGUSER, valueFrom: { secretKeyRef: { name: sentropic-idp-identity-reader, key: PGUSER } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: sentropic-idp-identity-reader, key: PGPASSWORD } } }
              volumeMounts: [{ name: work, mountPath: /work }, { name: sql, mountPath: /sql, readOnly: true }]
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
          containers:
            - name: upload
              image: peakcom/s5cmd:v2.2.2@sha256:6e551552f7c6ffde461e3cfe6fab82cd3345b574bd256193194081fd9022da4a
              args: ["--log", "error", "--endpoint-url", "$(S3_ENDPOINT)", "cp", "/work/*", "s3://$(S3_BUCKET)/idp-identity/latest/"]
              env:
                - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: sentropic-idp-relay-writer, key: S3_ACCESS_KEY } } }
                - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: sentropic-idp-relay-writer, key: S3_SECRET_KEY } } }
                - { name: AWS_REGION, valueFrom: { secretKeyRef: { name: sentropic-idp-relay-writer, key: S3_REGION } } }
                - { name: S3_ENDPOINT, valueFrom: { secretKeyRef: { name: sentropic-idp-relay-writer, key: S3_ENDPOINT } } }
                - { name: S3_BUCKET, valueFrom: { secretKeyRef: { name: sentropic-idp-relay-writer, key: S3_BUCKET } } }
              volumeMounts: [{ name: work, mountPath: /work, readOnly: true }]
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
