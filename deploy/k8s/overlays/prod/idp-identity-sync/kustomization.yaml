apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentropic
resources:
  - access.yaml
  - cronjob.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: sentropic-idp-identity-export-sql
    files: [export-prod.sql, export-prod.sh]
  - name: sentropic-idp-reader-role-sql
    files: [reader-role.sql]
