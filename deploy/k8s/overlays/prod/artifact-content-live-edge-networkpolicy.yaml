# A-LIVE W9 live edge. immo's content host (the radar-api reader pods, which serve
# the immo pages domain) gates live requests, strips browser credentials and
# forwards them with a signed host assertion to artifact-content. Live routes use
# the single content listener (HTTP and websocket upgrade, TCP 8791).
# Same environment only: radar-immobilier -> sentropic. Additive to the base Traefik ingress;
# the matching egress in radar-immobilier is owned by k8s and immo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immo-content-host-to-artifact-content
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: artifact-content
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: radar-immobilier
          podSelector:
            matchLabels:
              app.kubernetes.io/name: radar-immobilier
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8791
