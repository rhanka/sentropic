# Public ingress for the sentropic tenant, exposed through the cluster-wide
# Traefik + shared SCW LoadBalancer delivered by the poc-k8s platform stack
# (see poc-k8s: platform/20-traefik.yaml, platform/30-clusterissuer.yaml).
#
# Single host: the nginx baked into the UI image already proxies /api -> api:8787
# (see 40-ui.yaml), so everything is routed to the `ui` Service and nginx fans
# out /api internally. No separate API subdomain is needed.
#
# TLS is issued by cert-manager via the platform `letsencrypt-prod` ClusterIssuer
# (ACME DNS-01, Cloudflare solver on zone sent-tech.ca). The A record
# `sentropic.sent-tech.ca` must point at the Traefik LoadBalancer public IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentropic
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sentropic.sent-tech.ca
      secretName: sentropic-tls
  rules:
    - host: sentropic.sent-tech.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  name: http
---
# BR-39 deploy — public host for the standalone IdP (auth.sent-tech.ca), exposed
# through the SAME Traefik + cert-manager as sentropic.sent-tech.ca. The IdP
# serves its screens AND /api/v1/auth/* + /.well-known/* on ONE origin, so a
# single `/` path routes everything to auth-idp:8787 (no /api split like the ui).
#
# TLS is issued by cert-manager via the platform `letsencrypt-prod` ClusterIssuer
# (ACME DNS-01, Cloudflare solver). The A record `auth.sent-tech.ca` must point at
# the same Traefik LoadBalancer public IP as sentropic.sent-tech.ca (DNS gate).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-idp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.sent-tech.ca
      secretName: auth-idp-tls
  rules:
    - host: auth.sent-tech.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-idp
                port:
                  name: http
