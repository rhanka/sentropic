apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentropic
resources:
  - ../../base
  - ingress.yaml
  - artifact-content-ingress.yaml
  - artifact-content-live-edge-networkpolicy.yaml
  - idp-identity-sync
# Pins the live OVH storage class on the postgres StatefulSet, mirroring
# overlays/preprod (#474). Without it the prod overlay cannot converge at all.
patches:
  - path: patch-artifact-content-config.yaml
  - path: patch-api-config.yaml
  - path: patch-postgres-storageclass.yaml
  # T3 A4 prod cutover: candidate pins api=IdP 405a2759 / ui 18ad65c8 (train T3, T2-GO).
  # Apply only while the fence is held or after resume (runbook prod-a4-cutover.md After-1);
  # make k8s-deploy targets overlays/prod-a4 so the A4 wiring is preserved.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                image: ghcr.io/rhanka/sentropic-api@sha256:405a2759af42d54e1bf24d60032bb3ca9ff5d5375def353d9fbb5fd5da0de1ce
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-idp
      spec:
        template:
          spec:
            containers:
              - name: auth-idp
                image: ghcr.io/rhanka/sentropic-api@sha256:405a2759af42d54e1bf24d60032bb3ca9ff5d5375def353d9fbb5fd5da0de1ce
  # Content is not deployed yet; pin the candidate API image (same as api), no activation.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: artifact-content
      spec:
        template:
          spec:
            containers:
              - name: artifact-content
                image: ghcr.io/rhanka/sentropic-api@sha256:405a2759af42d54e1bf24d60032bb3ca9ff5d5375def353d9fbb5fd5da0de1ce
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
      spec:
        template:
          spec:
            containers:
              - name: postgres
                image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ui
      spec:
        template:
          spec:
            containers:
              - name: ui
                image: ghcr.io/rhanka/sentropic-ui@sha256:18ad65c8b93c425b82647659dcf6d134c42a8e8112aa68fbbe0f115de87a449d
