apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentropic
resources:
  - ../../base
  - ingress.yaml
  - artifact-content-ingress.yaml
  - artifact-content-live-edge-networkpolicy.yaml
  - idp-identity-sync
# Pins the live OVH storage class on the postgres StatefulSet, mirroring
# overlays/preprod (#474). Without it the prod overlay cannot converge at all.
patches:
  - path: patch-artifact-content-config.yaml
  - path: patch-postgres-storageclass.yaml
  # Preserve each live production image (hono 4.13.17 / @hono/node-server 2.1.6 maintenance builds, 2026-11-07): remove at the A4 prod cutover.
  # API and IdP use different releases from the same repository.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                image: ghcr.io/rhanka/sentropic-api@sha256:4bfa71ce7e231a9ed752e4aaceb23129a3399540af4720e32e76782c3f798c05
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-idp
      spec:
        template:
          spec:
            containers:
              - name: auth-idp
                image: ghcr.io/rhanka/sentropic-api@sha256:4b78a02fc743ae85ce9f5819d5ebc6b49e02fca7b3161a87ea06afa401a3dc34
  # Content is not deployed yet; retain the serving API release while closed.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: artifact-content
      spec:
        template:
          spec:
            containers:
              - name: artifact-content
                image: ghcr.io/rhanka/sentropic-api@sha256:4bfa71ce7e231a9ed752e4aaceb23129a3399540af4720e32e76782c3f798c05
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
      spec:
        template:
          spec:
            containers:
              - name: postgres
                image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ui
      spec:
        template:
          spec:
            containers:
              - name: ui
                image: ghcr.io/rhanka/sentropic-ui@sha256:1f33dd0cde7733d2061f02ab1a5a14eb1a6276ce99001c697f5c697e2c0c9d4e
