apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artifact-content
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/private-key-rotation-policy: Always
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "*.preprod.sentropic.sent-tech.ca"
        - "*.pinned.preprod.sentropic.sent-tech.ca"
      secretName: artifact-content-tls
  rules:
    - host: "*.preprod.sentropic.sent-tech.ca"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artifact-content
                port:
                  name: http
    - host: "*.pinned.preprod.sentropic.sent-tech.ca"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artifact-content
                port:
                  name: http
