apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentropic-preprod
resources:
  - access.yaml
  - cronjob.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: sentropic-idp-identity-sync-sql
    files: [import-preprod.sql, import-preprod.sh, client-map.csv, host-map.csv, client-policy.sql, sync-clients.sql, client-postcondition.sql]
