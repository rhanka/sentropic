apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentropic-idp-sync
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-idp-sync-to-postgres
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: sentropic, app.kubernetes.io/component: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: idp-identity-sync } }
      ports: [{ protocol: TCP, port: 5432 }]
