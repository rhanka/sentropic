# GB4 (PREPROD ONLY): open the api's artifact host surface. The builder composition
# (createBuilderService behind ARTIFACT_BUILDER_ENABLED, origin/main) refuses to boot
# with ARTIFACT_BUILDER_ENABLED=1 unless APP_ARTIFACT_HOST_ENABLED=1, so this explicit
# env is required before that flag lands from Secret/sentropic-api via the base
# envFrom. CONTENT and READER stay closed on the api (explicit "0" in the base never
# touched): the api only hosts artifact management + the builder; content serving is
# the artifact-content pod's job.
#
# APP_ARTIFACT_QUOTA_BYTES (instance.ts module-load guard) lands in patch-api-config.yaml;
# the builder's rw APP_ARTIFACT_S3_* credential is an owner-added key set of the existing
# Secret/sentropic-api — envFrom already injects it into this container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: APP_ARTIFACT_HOST_ENABLED
              value: "1"
