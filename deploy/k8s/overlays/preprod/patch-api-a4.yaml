# Tenant provisions custody and qualified budgets before the authorized API boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: api
          command: ["node", "/run/cm-runtime/launch.mjs"]
          env:
            - name: EMAIL_CODE_HMAC_KEY_ACTIVE
              valueFrom:
                secretKeyRef: { name: email-code-hmac, key: EMAIL_CODE_HMAC_KEY_ACTIVE }
            - name: EMAIL_CODE_HMAC_KEY_ACTIVE_REF
              valueFrom:
                secretKeyRef: { name: email-code-hmac, key: EMAIL_CODE_HMAC_KEY_ACTIVE_REF }
            - name: EMAIL_CODE_HMAC_KEY_PREVIOUS
              valueFrom:
                secretKeyRef: { name: email-code-hmac, key: EMAIL_CODE_HMAC_KEY_PREVIOUS, optional: true }
            - name: EMAIL_CODE_HMAC_KEY_PREVIOUS_REF
              valueFrom:
                secretKeyRef: { name: email-code-hmac, key: EMAIL_CODE_HMAC_KEY_PREVIOUS_REF, optional: true }
            - name: CM_IDENTITY_DELETION_BUDGETS_JSON
              valueFrom:
                secretKeyRef: { name: sentropic-identity-budgets, key: CM_IDENTITY_DELETION_BUDGETS_JSON }
          volumeMounts:
            - { name: cm-cutover, mountPath: /run/cm-cutover, readOnly: true }
            - { name: cm-runtime, mountPath: /run/cm-runtime, readOnly: true }
      volumes:
        - name: cm-cutover
          persistentVolumeClaim: { claimName: sentropic-a4-custody, readOnly: true }
        - name: cm-runtime
          configMap: { name: sentropic-a4-runtime, defaultMode: 0444 }
