# PREPROD public ingress — D4 NESTED hosts (owner-ratified): the tier is a
# sub-domain of the prod hosts. Mirrors overlays/prod/ingress.yaml (same shared
# Traefik + SCW LoadBalancer 51.159.11.157, same cert-manager letsencrypt-prod
# ClusterIssuer) but serves the isolated `sentropic-preprod` namespace on:
#   - preprod.sentropic.sent-tech.ca → ui  (nginx proxies /api → api:8787 internally)
#   - preprod.auth.sent-tech.ca      → auth-idp:8787 (serves screens + /api/v1/auth/* + /.well-known/*)
#
# TLS is issued by cert-manager via the platform `letsencrypt-prod` ClusterIssuer
# (ACME DNS-01, Cloudflare solver on zone sent-tech.ca). The A records
# `preprod.sentropic.sent-tech.ca` and `preprod.auth.sent-tech.ca` must point at
# the Traefik LoadBalancer public IP (posted by the poc-k8s operator on ingress-ready).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentropic
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - preprod.sentropic.sent-tech.ca
      secretName: sentropic-tls
  rules:
    - host: preprod.sentropic.sent-tech.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  name: http
---
# PREPROD standalone IdP host (mirrors prod's auth-idp ingress). One `/` path
# routes everything to auth-idp:8787 (no /api split like the ui).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-idp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - preprod.auth.sent-tech.ca
      secretName: auth-idp-tls
  rules:
    - host: preprod.auth.sent-tech.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-idp
                port:
                  name: http
