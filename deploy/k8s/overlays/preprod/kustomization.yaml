apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PREPROD tier (SPEC_DECISION_DEPLOYMENT_PLANE.md, RATIFIED). Re-stamps the shared
# base/ into the isolated `sentropic-preprod` namespace (baseline — Namespace,
# ResourceQuota, LimitRange, default-deny NetworkPolicy — owned by the poc-k8s
# operator, k8s-ops #37/#39). Public GHCR images need no pull secret. The base ships
# NO Namespace resource and its allow-traefik-to-{ui,auth-idp} NetworkPolicies are
# namespace-agnostic (namespaceSelector: traefik), so the `namespace:` transformer
# below is sufficient: no `$patch:delete`, no extra netpol. Postgres is the base
# StatefulSet re-stamped here → its OWN PVC in this ns (D3, separate preprod DB).
namespace: sentropic-preprod
resources:
  - ../../base
  - ingress.yaml
  - artifact-content-ingress.yaml
  - artifact-content-live-edge-networkpolicy.yaml
  - artifact-content-object-store-networkpolicy.yaml
  - artifact-object-store
  - idp-identity-sync
# Images use the base default (:main) today, matching prod. The preprod CD pipeline
# (BR-55c, cd.yml main→preprod) repins immutable per-release tags/digests here, e.g.:
#   images:
#     - name: ghcr.io/rhanka/sentropic-api
#       newTag: vYYYY.MM.DD.N
# Per-tier host + isolated WebAuthn RP ID overrides (D4 nested hosts, D11R isolated
# identity). Strategic-merge patches override only the listed ConfigMap keys
# (Deployment patches: only the listed env entries — envFrom/volumes are list-replaced
# and restated in full). The distinct KEK/DB/signing-key SealedSecrets are
# operator-authored per ns (D6), not here.
patches:
  - path: patch-artifact-content-config.yaml
  - path: patch-artifact-content-deployment.yaml
  - path: patch-api-config.yaml
  - path: patch-auth-idp-config.yaml
  - path: patch-postgres-storageclass.yaml

# Repin to the ec3c0bcc8 main build (2026-11-09): API sha256:8a0039e8…61 from main CI run 42627071304
# (publish-api-image success, receipt and GHCR manifest verified; publish-ui-image skips on this head —
# no ui path changed — so the UI stays on sha256:bf1aa509…e0 published by the 7106defa7 build, run
# 42485651003). Brings preprod to the forge tarball link handling (#975) and the live teardown fix (#971), over the host build API job state contract (#969)
# over the remote live rows persistence fix (#967), the S2S service issuer fix (#963) and the GitHub App
# form-origin fix (#960).
# Continuous deployment applies ../preprod-a4 (this overlay plus the A4 runtime wiring).
images:
  - name: ghcr.io/rhanka/sentropic-api
    digest: sha256:8a0039e8198e98b1433003266ae389c6f0cf2360b05d1ac77c97f01144675c61
  - name: ghcr.io/rhanka/sentropic-ui
    digest: sha256:bf1aa5096ad41750a3dec307c37d0929a418f76c168588d3b8dc8287ab34d3e0
