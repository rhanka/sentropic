apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: artifact-content
spec:
  secretName: artifact-content-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.preprod.sentropic.sent-tech.ca"
    - "*.pinned.preprod.sentropic.sent-tech.ca"
  privateKey:
    rotationPolicy: Always
