apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentropic
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-to-api
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentropic
              app.kubernetes.io/component: ui
      ports:
        - protocol: TCP
          port: 8787
---
# BR-37c: allow the pgbackup CronJob/restore pods to reach postgres for pg_dump/psql.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbackup-to-postgres
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentropic
              app.kubernetes.io/component: pgbackup
      ports:
        - protocol: TCP
          port: 5432
---
# BR-37c: allow the cluster-wide Traefik ingress controller (ns `traefik`) to
# reach the UI pod. nginx in the UI image proxies /api -> api:8787 internally,
# and the ui->api hop is already covered by allow-ui-to-api, so Traefik only
# needs to reach ui:5173. Without this the default-deny-ingress drops the
# connection and HTTPS requests time out after the TLS handshake.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-ui
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 5173
---
# BR-39 deploy — the standalone IdP (auth-idp) shares the main api's Postgres
# (F1/D8 default). The baseline is default-deny-ingress, and allow-api-to-postgres
# only admits the api pod, so a separate policy admits the auth-idp pod to 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-idp-to-postgres
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentropic
              app.kubernetes.io/component: auth-idp
      ports:
        - protocol: TCP
          port: 5432
---
# BR-39 deploy — the IdP is public (auth.sent-tech.ca), so the cluster-wide
# Traefik ingress controller (ns `traefik`) hits the auth-idp pod DIRECTLY on
# 8787 (unlike the ui, which proxies /api internally). Without this the
# default-deny-ingress baseline drops the connection after the TLS handshake.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-auth-idp
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: auth-idp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: auth-idp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8787
