apiVersion: v1
kind: ConfigMap
metadata:
  name: api
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
data:
  NODE_ENV: "production"
  PORT: "8787"
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  CHAT_TRACE_ENABLED: "true"
  CHAT_TRACE_RETENTION_DAYS: "7"
  DISABLE_AUTH: "0"
  # Outbound email via Scaleway TEM HTTP API (BR-37b; SMTP egress blocked at platform level).
  # SCW_TEM_SECRET_KEY is provided by the sentropic-api SealedSecret; these are non-secret config.
  SCW_TEM_API_BASE_URL: "https://api.scaleway.com"
  SCW_TEM_REGION: "fr-par"
  SCW_TEM_PROJECT_ID: "09ac728a-e3b9-4a5b-9749-664b0f147c70"
  SCW_TEM_FROM_EMAIL: "no-reply@sent-tech.ca"
  SCW_TEM_FROM_NAME: "Sentropic"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8787
      targetPort: 8787
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sentropic
  labels:
    app.kubernetes.io/name: sentropic
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sentropic
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentropic
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: sentropic-app
      containers:
        - name: api
          image: rg.fr-par.scw.cloud/nc-reg/sentropic-api:main
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: api
            - secretRef:
                name: sentropic-api
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
