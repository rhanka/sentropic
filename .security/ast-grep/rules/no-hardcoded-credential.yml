id: no-hardcoded-credential
message: Do not hardcode credentials or tokens in source; read them from the environment.
severity: error
language: TypeScript
rule:
  any:
    - pattern: '{ $K: $V }'
    - pattern: '{ $K: $V, $$$REST }'
    - pattern: '{ $$$REST, $K: $V }'
constraints:
  K: { regex: '(?i)^(password|passwd|secret|api[_-]?key|access[_-]?token|secret[_-]?key|private[_-]?key|client[_-]?secret)$' }
  V: { regex: "^['\"][^'\"\\s]{8,}[\"']$" }
