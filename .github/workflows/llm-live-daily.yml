name: Daily live provider qualification
run-name: ${{ github.event.schedule == '47 * * * *' && 'Live provider schedule health' || 'Live provider qualification' }}

on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: live-provider-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  schedule-health:
    if: github.event.schedule == '47 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Detect missing, stale or failed daily execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: make ci-live-provider-health ENV=test-ci-live

  select:
    if: github.event.schedule != '47 * * * *'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tuple.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select the complete main qualification
        id: tuple
        env:
          GH_TOKEN: ${{ github.token }}
        run: make ci-live-provider-select ENV=test-ci-live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-provider-selection
          path: .tmp/live-provider/selection.json
          include-hidden-files: true
          if-no-files-found: error

  qualify:
    needs: select
    runs-on: ubuntu-latest
    env:
      CI_PROVIDER_MODE: live
      API_TEST_CI: '1'
      API_PORT: '9405'
      UI_PORT: '5605'
      MAILDEV_UI_PORT: '1505'
      REGISTRY: ${{ secrets.REGISTRY }}
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.select.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: live-provider-selection
          path: .tmp/live-provider/
      - name: Reuse the selected immutable production tuple
        run: make ci-live-provider-prepare ENV=test-ci-live
      - name: Qualify complete API, browser and VSCode journeys with real providers
        run: make ci-live-provider-run ENV=test-ci-live
      - name: Record results, calls, cost availability and schedule health
        if: always()
        run: make ci-live-provider-finish ENV=test-ci-live
      - name: Stop the isolated live environment
        if: always()
        run: make down ENV=test-ci-live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: live-provider-receipt
          path: |
            .tmp/live-provider/
            e2e/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
