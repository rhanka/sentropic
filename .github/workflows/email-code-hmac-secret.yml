name: Email-code HMAC Secret
# Single writer of Secret `email-code-hmac` values (method qk-secret-custody-r2
# §3.2): server-side apply onto the k8s-pre-created empty shell, fixed field
# manager, then rollout of Deployment api. Never creates or lists Secrets and
# never prints values; logs and the job summary carry names, refs and keyed
# fingerprints only. Dispatch on main only; the conductor triggers the first
# run after review.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Tier to materialize (preprod first, then prod)
        required: true
        type: choice
        options:
          - preprod
          - prod
permissions:
  contents: read
concurrency:
  group: email-code-hmac-secret-${{ inputs.tier }}
  cancel-in-progress: false
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: make test-email-code-hmac-selftest ENV=test-email-code-hmac
  materialize-preprod:
    needs: [selftest]
    if: github.ref == 'refs/heads/main' && inputs.tier == 'preprod'
    environment: sentropic-idp-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Configure writer identity
        env:
          KUBE_CONFIG_DATA_EMAIL_CODE_HMAC: ${{ secrets.KUBE_CONFIG_DATA_EMAIL_CODE_HMAC }}
        run: node deploy/ci/email-code-hmac/workflow.mjs configure
      - name: Preflight shell and writer rights (names only)
        run: node deploy/ci/email-code-hmac/workflow.mjs preflight preprod
      - name: Materialize Secret email-code-hmac (server-side apply onto the existing shell)
        env:
          EMAIL_CODE_HMAC_KEY_ACTIVE: ${{ secrets.EMAIL_CODE_HMAC_KEY_ACTIVE }}
          EMAIL_CODE_HMAC_KEY_PREVIOUS: ${{ secrets.EMAIL_CODE_HMAC_KEY_PREVIOUS }}
          EMAIL_CODE_HMAC_KEY_ACTIVE_REF: ${{ vars.EMAIL_CODE_HMAC_KEY_ACTIVE_REF }}
          EMAIL_CODE_HMAC_KEY_PREVIOUS_REF: ${{ vars.EMAIL_CODE_HMAC_KEY_PREVIOUS_REF }}
        run: node deploy/ci/email-code-hmac/workflow.mjs materialize preprod
      - name: Restart and watch Deployment api
        run: node deploy/ci/email-code-hmac/workflow.mjs rollout preprod
      - name: Remove kubeconfig and temporary files
        if: always()
        run: node deploy/ci/email-code-hmac/workflow.mjs cleanup
  materialize-prod:
    needs: [selftest]
    if: github.ref == 'refs/heads/main' && inputs.tier == 'prod'
    environment: sentropic-idp-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Configure writer identity
        env:
          KUBE_CONFIG_DATA_EMAIL_CODE_HMAC: ${{ secrets.KUBE_CONFIG_DATA_EMAIL_CODE_HMAC }}
        run: node deploy/ci/email-code-hmac/workflow.mjs configure
      - name: Preflight shell and writer rights (names only)
        run: node deploy/ci/email-code-hmac/workflow.mjs preflight prod
      - name: Materialize Secret email-code-hmac (server-side apply onto the existing shell)
        env:
          EMAIL_CODE_HMAC_KEY_ACTIVE: ${{ secrets.EMAIL_CODE_HMAC_KEY_ACTIVE }}
          EMAIL_CODE_HMAC_KEY_PREVIOUS: ${{ secrets.EMAIL_CODE_HMAC_KEY_PREVIOUS }}
          EMAIL_CODE_HMAC_KEY_ACTIVE_REF: ${{ vars.EMAIL_CODE_HMAC_KEY_ACTIVE_REF }}
          EMAIL_CODE_HMAC_KEY_PREVIOUS_REF: ${{ vars.EMAIL_CODE_HMAC_KEY_PREVIOUS_REF }}
        run: node deploy/ci/email-code-hmac/workflow.mjs materialize prod
      - name: Restart and watch Deployment api
        run: node deploy/ci/email-code-hmac/workflow.mjs rollout prod
      - name: Remove kubeconfig and temporary files
        if: always()
        run: node deploy/ci/email-code-hmac/workflow.mjs cleanup
