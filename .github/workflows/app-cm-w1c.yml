name: App W1.c activation

on:
  push:
    branches: [feat/app-cm-w1c]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-w1c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-host-activation:
    runs-on: ubuntu-latest
    env:
      REGISTRY: localhost
      TARGET: development
      API_PORT: '8799'
      UI_PORT: '5185'
      MAILDEV_UI_PORT: '1092'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact pushed head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v4
      - name: Start isolated host executor
        run: flock /tmp/sentropic-docker.lock make up-api-test ENV=test-app-w1c
      - name: Qualify imported vectors, migrations, recovery and APP-P1
        run: >-
          flock /tmp/sentropic-docker.lock make test-api-endpoints
          SCOPE="tests/api/artifacts-host-activation-store.test.ts tests/api/artifacts-host-migrations.test.ts tests/api/artifacts-host-recovery.test.ts tests/api/app-mcp-registry.test.ts tests/api/app-mcp-installed.test.ts tests/api/app-artifacts-transport.test.ts"
          API_TEST_WORKERS=1 API_TEST_ARGS="--no-file-parallelism"
          ENV=test-app-w1c
      - name: Check API types and lint
        run: flock /tmp/sentropic-docker.lock make typecheck-api lint-api -o prepare-node-workspace ENV=test-app-w1c
      - name: Runtime diagnostics
        if: always()
        run: make logs-api ENV=test-app-w1c
      - name: Remove isolated stack
        if: always()
        run: flock /tmp/sentropic-docker.lock make down ENV=test-app-w1c
