name: IdP workload Secret
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: idp-workload-secret-preprod
  cancel-in-progress: false
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: make test-idp-sync-selftest ENV=test-idp-sync
  materialize-preprod-workload-secret:
    needs: [selftest]
    if: github.ref == 'refs/heads/main'
    environment: sentropic-idp-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Configure preprod identity
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: node deploy/ci/idp-identity-sync/run.mjs configure preprod
      - name: Materialize the named workload Secret
        env:
          IMMO_MCP_WORKLOAD_CLIENT_SECRET: ${{ secrets.IMMO_MCP_WORKLOAD_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdtempSync, writeFileSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { kube, workdir } from './deploy/ci/idp-identity-sync/run-core.mjs';
          try {
            const value = process.env.IMMO_MCP_WORKLOAD_CLIENT_SECRET;
            if (value?.length !== 64 || !/^[a-f0-9]{64}$/.test(value)) throw new Error('workload_credential_invalid');
            const name = 'immo-mcp-workload', namespace = 'sentropic-preprod';
            const directory = mkdtempSync(join(workdir(), 'workload-'));
            try {
              const file = join(directory, 'secret.json');
              const manifest = { apiVersion: 'v1', kind: 'Secret', metadata: { name, namespace }, type: 'Opaque',
                data: { IMMO_MCP_WORKLOAD_CLIENT_SECRET: Buffer.from(value, 'utf8').toString('base64') } };
              writeFileSync(file, JSON.stringify(manifest), { mode: 0o600, flag: 'wx' });
              const result = kube(['-n', namespace, 'apply', '--server-side', '--field-manager=idp-workload-secret', '-f', file]);
              if (!/^secret\/immo-mcp-workload serverside-applied\s*$/.test(result.stdout)) throw new Error('workload_secret_apply_failed');
              const fingerprint = createHash('sha256').update(value, 'utf8').digest('hex').slice(0, 8);
              console.log(JSON.stringify({ name, namespace, status: 'configured', fingerprint }));
            } finally { rmSync(directory, { recursive: true, force: true }); }
          } catch (error) {
            console.error(error.message === 'workload_credential_invalid' ? error.message : 'workload_secret_apply_failed');
            process.exitCode = 1;
          }
          NODE
      - name: Remove kubeconfig and temporary files
        if: always()
        run: node deploy/ci/idp-identity-sync/run.mjs cleanup
