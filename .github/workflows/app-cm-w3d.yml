name: App W3.d closed content manifests

on:
  push:
    branches: [feat/app-cm-w3d]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-w3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-content-manifests:
    runs-on: ubuntu-latest
    env:
      API_PORT: '8806'
      UI_PORT: '5192'
      MAILDEV_UI_PORT: '1099'
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact pushed head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify default-closed overlays, TLS, isolation and digest replacement
        run: flock /tmp/sentropic-docker.lock make test-artifact-content-manifests ENV=test-app-w3d
      - name: Preserve parent-overlay and restore controls
        run: flock /tmp/sentropic-docker.lock make test-idp-sync-selftest ENV=test-app-w3d
      - name: Preserve canonical content image inputs
        run: flock /tmp/sentropic-docker.lock make test-artifact-content-image CONTENT_IMAGE_CASE=static ENV=test-app-w3d
      - name: Remove isolated stack
        if: always()
        run: flock /tmp/sentropic-docker.lock make down ENV=test-app-w3d
