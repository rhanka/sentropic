name: App W3.c canonical content image

on:
  push:
    branches: [feat/app-cm-w3c]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-w3c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-content-image:
    runs-on: ubuntu-latest
    env:
      REGISTRY: localhost
      API_PORT: '8805'
      UI_PORT: '5191'
      MAILDEV_UI_PORT: '1098'
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact pushed head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v4
      - name: Build and record the canonical production artifact once
        run: flock /tmp/sentropic-docker.lock make build-api-image-fresh ENV=test-app-w3c
      - name: Qualify the real content role and production pruning
        run: flock /tmp/sentropic-docker.lock make test-artifact-content-image test-ci-api-runtime ENV=test-app-w3c
      - name: Qualify canonical identity, publication guards and hash filters
        run: flock /tmp/sentropic-docker.lock make test-ci-api-image-canonical test-ci-api-tag-guard check-ci-version-filters ENV=test-app-w3c
      - name: Remove isolated stack
        if: always()
        run: flock /tmp/sentropic-docker.lock make down ENV=test-app-w3c
