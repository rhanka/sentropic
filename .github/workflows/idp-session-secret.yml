name: IdP session Secret
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: idp-session-secret-preprod
  cancel-in-progress: false
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: make test-idp-sync-selftest ENV=test-idp-sync
  materialize-preprod-session-secret:
    needs: [selftest]
    if: github.ref == 'refs/heads/main'
    environment: sentropic-idp-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Configure preprod identity
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: node deploy/ci/idp-identity-sync/run.mjs configure preprod
      - name: Materialize the named session Secret
        env:
          AUTH_IDP_SESSION_JWT_SECRET: ${{ secrets.AUTH_IDP_SESSION_JWT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdtempSync, writeFileSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { kube, workdir } from './deploy/ci/idp-identity-sync/run-core.mjs';
          try {
            const value = process.env.AUTH_IDP_SESSION_JWT_SECRET;
            if (value?.length !== 64 || !/^[a-f0-9]{64}$/.test(value)) throw new Error('session_credential_invalid');
            const name = 'auth-idp-session-signing', namespace = 'sentropic-preprod';
            const directory = mkdtempSync(join(workdir(), 'session-'));
            try {
              const file = join(directory, 'secret.json');
              const manifest = { apiVersion: 'v1', kind: 'Secret', metadata: { name, namespace }, type: 'Opaque',
                data: { JWT_SECRET: Buffer.from(value, 'utf8').toString('base64') } };
              writeFileSync(file, JSON.stringify(manifest), { mode: 0o600, flag: 'wx' });
              const result = kube(['-n', namespace, 'apply', '--server-side', '--field-manager=idp-session-secret', '-f', file]);
              if (!/^secret\/auth-idp-session-signing serverside-applied\s*$/.test(result.stdout)) throw new Error('session_secret_apply_failed');
              const fingerprint = createHash('sha256').update(value, 'utf8').digest('hex').slice(0, 8);
              console.log(JSON.stringify({ name, namespace, status: 'configured', fingerprint }));
            } finally { rmSync(directory, { recursive: true, force: true }); }
          } catch (error) {
            console.error(error.message === 'session_credential_invalid' ? error.message : 'session_secret_apply_failed');
            process.exitCode = 1;
          }
          NODE
      - name: Provision issuer-only storage before any workload apply
        run: |
          node --input-type=module <<'NODE'
          import { kube } from './deploy/ci/idp-identity-sync/run-core.mjs';
          const namespace = 'sentropic-preprod', name = 'auth-idp-session-authority';
          kube(['-n', namespace, 'apply', '--server-side', '--field-manager=idp-session-secret', '-f', '-'], {
            input: JSON.stringify({ apiVersion: 'v1', kind: 'PersistentVolumeClaim', metadata: { name, namespace },
              spec: { accessModes: ['ReadWriteOnce'], resources: { requests: { storage: '1Gi' } } } }),
          });
          kube(['-n', namespace, 'wait', '--for=jsonpath={.status.phase}=Bound', `pvc/${name}`, '--timeout=120s']);
          NODE
      - name: Remove kubeconfig and temporary files
        if: always()
        run: node deploy/ci/idp-identity-sync/run.mjs cleanup
