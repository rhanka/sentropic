    if: always() && !cancelled() && (needs.changes.outputs.llm_mesh == 'true' || needs.changes.outputs.global == 'true')
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Lint LLM Mesh
        run: make lint-llm-mesh ENV=test-ci-llm-mesh
