    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        with:
          name: desktop-download
          path: ui/static/cowork-desktop/
      - name: Build UI image
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make ci-build-ui ENV=test-ci-images
      - name: Save UI image as artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make save-ui
      - name: Upload UI image artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-image
          retention-days: 1
          path: |
            ui-image.tar.zst
            ui-image.json
          compression-level: 0

  build-ui-static:
    runs-on: ubuntu-latest
    needs: [changes, build-desktop]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: desktop-download
          path: ui/static/cowork-desktop/
      - name: Build UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make ci-build-ui-static ENV=test-ci-images
        env:
          VITE_API_BASE_URL: https://sentropic.sent-tech.ca/api/v1
      - name: Upload static files as artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ui/build/

  test-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, build-api-image, build-ui, build-e2e]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        include:
          - group: group-a
            e2e_groups: "00 02 06 10"
          - group: group-b
            e2e_groups: "01 04"
          - group: group-c
            e2e_groups: "03"
          - group: group-d
            e2e_groups: "08 09"
          - group: group-e
            e2e_groups: "05 07"
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Download API image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-image
          path: .
      - name: Download UI image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ui-image
          path: .
      - name: Load API image from artifact
        run: make load-api
      - name: Load UI image from artifact
        run: make load-ui
      - name: Download E2E image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: e2e-image
          path: .
      - name: Load exact E2E image
        run: make load-e2e ENV=e2e-ci
      - name: Test e2e API & UI (${{ matrix.group }})
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          E2E_GROUPS: ${{ matrix.e2e_groups }}
        run: make test-e2e ENV=e2e-ci
      - name: E2E service diagnostics
        if: failure()
        run: make logs-api ENV=e2e-ci

  e2e-vscode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, build-api-image, build-ui, build-e2e]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      E2E_SPEC: tests/vscode/01-vscode-chat-streaming.spec.ts
      OPENVSCODE_PORT: 3115
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Download API image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        run: make load-api
      - name: Download UI image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ui-image
          path: .
      - name: Load UI image from artifact
        run: make load-ui
      - name: Download E2E image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: e2e-image
          path: .
      - name: Load exact E2E image
        run: make load-e2e ENV=e2e-vscode-ci
      - name: Test VSCode E2E lane
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: make test-e2e-vscode ENV=e2e-vscode-ci
      - name: Upload VSCode E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-vscode-results
          path: e2e/test-results/
          retention-days: 7

  # BR-39r (L2 guard) — screen-driven SSO smoke for the standalone IdP. Drives
  # the IdP-SERVED login + consent screens in headless Chromium and clicks the
  # real Approve button, asserting the native-form POST yields a server 302 to
  # the RP redirect_uri with an authorization code. This is the guard that was
  # missing when the JS-dependent consent navigation regressed in prod: a green
  # API/unit suite never exercised the served consent screen end-to-end.
  smoke-idp-screens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, build-api-image, build-api-tool-image, build-e2e]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      DISABLE_RATE_LIMIT: 'true'
      API_PORT: '9491'
      UI_PORT: '5691'
      MAILDEV_UI_PORT: '1591'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Download API image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        run: make load-api ENV=test-ci-idp
      - name: Download CI toolbox
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-tool-image
          path: .
      - name: Load CI toolbox
        run: make load-api-tool ENV=test-ci-idp
      - name: Download qualified browser image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: e2e-image
          path: .
      - name: Load qualified browser image
        run: make load-e2e ENV=test-ci-idp
      - name: Start standalone IdP (screens + API on shared DB)
        run: make up-idp-sut ENV=test-ci-idp
      - name: Screen-driven SSO smoke (served login + consent screens)
        run: make smoke-idp-screens-ci ENV=test-ci-idp
      - name: IdP logs on failure
        if: failure()
        run: make logs-api-ci ENV=test-ci-idp
      - name: Tear down IdP overlay
        if: always()
        run: make down-api-ci ENV=test-ci-idp

  security-code-api:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - scan: sast
          - scan: sca
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Run unchanged security gate
        run: make test-api-security-${{ matrix.scan }} ENV=test-ci-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-code-api-${{ matrix.scan }}-results
          include-hidden-files: true
          path: .security/${{ matrix.scan }}-api*
          if-no-files-found: error
          retention-days: 30

  security-code-ui:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - scan: sast
          - scan: sca
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Run unchanged security gate
        run: make test-ui-security-${{ matrix.scan }} ENV=test-ci-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-code-ui-${{ matrix.scan }}-results
          include-hidden-files: true
          path: .security/${{ matrix.scan }}-ui*
          if-no-files-found: error
          retention-days: 30

  security-sast-sca:
    runs-on: ubuntu-latest
    needs: [changes, security-code-api, security-code-ui]
    if: >-
      !cancelled() &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require every selected SAST and SCA scan
        env:
          CI_SECURITY_NEEDS: ${{ toJSON(needs) }}
          CI_SECURITY_CATEGORY: code
        run: make ci-security-join ENV=test-ci-security

  # Security: IaC scans (infrastructure configuration)
  security-iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Run IaC security scan
        run: make test-security-iac
        continue-on-error: false
      - name: Upload security scan results (IaC)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-iac-results
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .security/iac-infra.json
            .security/iac-infra-parsed.yaml
          retention-days: 30

  security-container-api:
    runs-on: ubuntu-latest
    needs: [changes, build-api-image]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-image
          path: .
      - name: Verify candidate and run unchanged container gate
        run: make load-api test-api-security-container ENV=test-ci-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-container-api-results
          include-hidden-files: true
          path: |
            .security/container-api.json
            .security/container-api-parsed.*
          if-no-files-found: error
          retention-days: 30

  security-container-api-tool:
    runs-on: ubuntu-latest
    needs: [changes, build-api-tool-image]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-tool-image
          path: .
      - name: Verify candidate and run unchanged container gate
        run: make load-api-tool test-api-tool-security-container ENV=test-ci-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-container-api-tool-results
          include-hidden-files: true
          path: |
            .security/container-api-tool.json
            .security/container-api-tool-parsed.*
          if-no-files-found: error
          retention-days: 30

  security-container-ui:
    runs-on: ubuntu-latest
    needs: [changes, build-ui]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ui-image
          path: .
      - name: Verify candidate and run unchanged container gate
        run: make load-ui test-ui-security-container ENV=test-ci-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-container-ui-results
          include-hidden-files: true
          path: |
            .security/container-ui.json
            .security/container-ui-parsed.*
          if-no-files-found: error
          retention-days: 30

  security-container-e2e:
    runs-on: ubuntu-latest
    needs: [changes, build-e2e]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: e2e-image
          path: .
      - name: Verify candidate and run unchanged container gate
        run: make load-e2e test-e2e-security-container ENV=test-ci-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-container-e2e-results
          include-hidden-files: true
          path: |
            .security/container-e2e.json
            .security/container-e2e-parsed.*
          if-no-files-found: error
          retention-days: 30

  # Every selected image scan remains blocking at this complete join.
  security-container:
    runs-on: ubuntu-latest
    needs: [changes, security-container-api, security-container-api-tool, security-container-ui, security-container-e2e]
    if: >-
      !cancelled() &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require every selected container scan
        env:
          CI_SECURITY_NEEDS: ${{ toJSON(needs) }}
          CI_SECURITY_CATEGORY: container
        run: make ci-security-join ENV=test-ci-security

  test-smoke-restore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, build-api-image, build-api-tool-image]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    env:
      API_TEST_CI: '1'
      API_TEST_SUT: '1'
      API_PORT: '9491'
      UI_PORT: '5691'
      MAILDEV_UI_PORT: '1591'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Download API image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-image
          path: .
      - name: Load API image
        run: make load-api ENV=test-ci-restore
      - name: Download CI toolbox
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-tool-image
          path: .
      - name: Load CI toolbox
        run: make load-api-tool ENV=test-ci-restore
      - name: Backup production database (k8s in-cluster postgres)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -eu
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::GH secret KUBECONFIG_B64 is missing or empty."
            exit 1
          fi
          printf '%s' "${KUBECONFIG_B64}" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml
          make db-backup-prod KUBECONFIG="$PWD/kubeconfig.yaml" ENV=test-ci-restore
      - name: Test restore and smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          backup="$(make -s latest-prod-backup ENV=test-ci-restore)"
          make restore-api-sut verify-api-sut-restart test-api-smoke-restore BACKUP_FILE="$backup" ENV=test-ci-restore
      - name: Show restore SUT logs on failure
        if: failure()
        run: make logs-api-ci ENV=test-ci-restore
      - name: Tear down restore SUT
        if: always()
        run: make down-api-ci ENV=test-ci-restore

  publish-ui-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, typecheck-lint-api, typecheck-lint-ui, security-sast-sca, test-ui, build-ui-static, test-e2e, e2e-vscode, security-container, security-iac]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true') &&
      needs.changes.result == 'success' &&
      needs.typecheck-lint-api.result == 'success' &&
      needs.typecheck-lint-ui.result == 'success' &&
      needs.security-sast-sca.result == 'success' &&
      needs.test-ui.result == 'success' &&
      needs.build-ui-static.result == 'success' &&
      needs.test-e2e.result == 'success' &&
      needs.e2e-vscode.result == 'success' &&
      needs.security-container.result == 'success' &&
      (needs.security-iac.result == 'success' || (needs.security-iac.result == 'skipped' && needs.changes.outputs.global != 'true'))
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      UI_IMAGE_NAME: sentropic-ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check if UI image is up to date
        id: image-check
        run: make check-ui-image
        continue-on-error: true
      - name: Download UI image artifact
        if: steps.image-check.outcome == 'failure'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ui-image
          path: .
      - name: Load UI image from artifact
        if: steps.image-check.outcome == 'failure'
        run: make load-ui
      - name: Publish UI image
        if: steps.image-check.outcome == 'failure'
        run: make publish-ui-image
      - name: Push main alias tag (UI)
        run: |
          set -eu
          ALIAS="main"
          UI_VERSION="$(make -s version | awk '/^UI_VERSION:/ {print $2}')"
          # Ensure canonical tag is present locally (it may not be if image-check passed)
          docker pull "${REGISTRY}/${UI_IMAGE_NAME}:${UI_VERSION}"
          docker tag  "${REGISTRY}/${UI_IMAGE_NAME}:${UI_VERSION}" "${REGISTRY}/${UI_IMAGE_NAME}:${ALIAS}"
          docker push "${REGISTRY}/${UI_IMAGE_NAME}:${ALIAS}"

  publish-api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: api-image-publication
      cancel-in-progress: false
    needs: [changes, typecheck-lint-api, typecheck-lint-ui, security-sast-sca, test-ui, build-ui-static, test-api-unit-integration, test-e2e, e2e-vscode, smoke-idp-screens, test-smoke-restore, security-container, security-iac]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true') &&
      needs.changes.result == 'success' &&
      needs.typecheck-lint-api.result == 'success' &&
      needs.typecheck-lint-ui.result == 'success' &&
      needs.security-sast-sca.result == 'success' &&
      (needs.test-ui.result == 'success' || (needs.test-ui.result == 'skipped' && needs.changes.outputs.ui != 'true' && needs.changes.outputs.global != 'true')) &&
      (needs.build-ui-static.result == 'success' || (needs.build-ui-static.result == 'skipped' && needs.changes.outputs.ui != 'true' && needs.changes.outputs.global != 'true')) &&
      needs.test-api-unit-integration.result == 'success' &&
      needs.test-e2e.result == 'success' &&
      needs.e2e-vscode.result == 'success' &&
      needs.smoke-idp-screens.result == 'success' &&
      needs.test-smoke-restore.result == 'success' &&
      needs.security-container.result == 'success' &&
      (needs.security-iac.result == 'success' || (needs.security-iac.result == 'skipped' && needs.changes.outputs.global != 'true'))
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      API_IMAGE_NAME: sentropic-api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download API image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        run: make load-api
      - name: Publish API image
        run: make publish-api-image
      - name: Push main alias tag (API)
        run: make publish-api-main-image

  # Release train (BRDP-EX10): llm-mesh -> llm-gateway -> cluster-mesh publish in a strict chain,
  # never before the three train validations pass (a validation counts as skipped only when its
  # own trigger filter and `global` are false), serialized across runs by one concurrency group.
  publish-llm-mesh:
    runs-on: ubuntu-latest
    needs: [changes, validate-llm-mesh, validate-llm-gateway, validate-cluster-mesh]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (github.ref == 'refs/heads/main' || inputs.capacity_publish_dry_run == true) &&
      needs.changes.outputs.llm_mesh_publish == 'true' &&
      (needs.validate-llm-mesh.result == 'success' || (needs.validate-llm-mesh.result == 'skipped' && needs.changes.outputs.llm_mesh != 'true' && needs.changes.outputs.global != 'true')) &&
      (needs.validate-llm-gateway.result == 'success' || (needs.validate-llm-gateway.result == 'skipped' && needs.changes.outputs.llm_gateway != 'true' && needs.changes.outputs.global != 'true')) &&
      (needs.validate-cluster-mesh.result == 'success' || (needs.validate-cluster-mesh.result == 'skipped' && needs.changes.outputs.cluster_mesh != 'true' && needs.changes.outputs.global != 'true'))
    concurrency:
      group: npm-publish-train
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Dry-run package publication
        if: inputs.capacity_publish_dry_run == true
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make ci-capacity-publish-dry-run PACKAGE=llm-mesh ENV=test-ci-capacity
      - name: Publish LLM Mesh
        if: inputs.capacity_publish_dry_run != true
        env:
          CLOUD_CODE_OAUTH_CLIENT_SECRET: ${{ secrets.LLM_MESH_CLOUD_CODE_OAUTH_CLIENT_SECRET }}
        run: |
          set -eu
          umask 077
          credential_file="${RUNNER_TEMP}/cloud-code-oauth-client-secret"
          trap 'rm -f "$credential_file"' EXIT
          test -n "$CLOUD_CODE_OAUTH_CLIENT_SECRET"
          printf '%s' "$CLOUD_CODE_OAUTH_CLIENT_SECRET" > "$credential_file"
          unset CLOUD_CODE_OAUTH_CLIENT_SECRET
          make publish-llm-mesh CLOUD_CODE_OAUTH_CLIENT_SECRET_FILE="$credential_file"

  publish-llm-gateway:
    runs-on: ubuntu-latest
    needs: [changes, validate-llm-mesh, validate-llm-gateway, validate-cluster-mesh, publish-llm-mesh]
    if: >-
      !cancelled() &&
