              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-desktop/**'
              - 'packages/cowork-bridge/**'
              - 'packages/chat-ui/**'
              - '.github/workflows/ci.yml'
            cowork_desktop_publish:
