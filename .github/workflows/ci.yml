name: CI

on:
  push:
    branches: [main]
  pull_request:
    # BR861-EX1 and BR-E2-EX1: integration topics qualify without publishing.
    branches: [main, feat/immo-861-integration, feat/engram-e2-integration, feat/live-stt-l1c]
  workflow_dispatch:
    inputs:
      decision_fixtures_only:
        description: 'Decision fixtures only: no provider credentials, publication or live acceptance'
        type: boolean
        default: false
      image_cache_mode:
        description: 'Image qualification: persistent warm layers or a full cold rebuild'
        type: choice
        default: warm
        options: [warm, cold]
      capacity_publish_dry_run:
        description: 'Qualify package publication jobs on this ref using guarded pack targets; never publish'
        type: boolean
        default: false
      bootstrap_publish_target:
        description: 'Bootstrap-publish target: exactly one explicit package is required, there is no "all" option (uses NPM_TOKEN; first publish only before OIDC trusted publishers are attached)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - contracts
          - events
          - chat-core
          - chat-server
          - comments
          - chat-ui
          - oauth-verify
          - mcp-auth
          - mcp-platform
          - auth-client
          - auth-ui
          - flow
          - cowork-bridge
          - cowork-desktop
          - harness
          - llm-gateway
          - cluster-mesh
          - cited-source-viewer
          - artifacts

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ${{ inputs.decision_fixtures_only != true && secrets.REGISTRY || 'local' }}
  ADMIN_EMAIL: ${{ inputs.decision_fixtures_only != true && secrets.ADMIN_EMAIL || 'decision-test@example.test' }}
  CI_IMAGE_CACHE: ${{ inputs.image_cache_mode == 'cold' && '0' || '1' }}

# BR76-EX1 — capacity reservation: cancel only superseded PR attempts; main
# releases are never cancelled and serialize on one group (no release overlap).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# BR77-EX1: independent jobs use hosted-runner scheduling; no per-index mutexes.
# Matrix widths and PR cancellation bound each run; release groups remain separate.
jobs:
  decision-offline:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.decision_fixtures_only == true
    permissions:
      contents: read
    env:
      REGISTRY: local
      ADMIN_EMAIL: decision-test@example.test
      OPENAI_API_KEY: ''
      JEV_API_KEY: ''
      GEMINI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      MISTRAL_API_KEY: ''
      COHERE_API_KEY: ''
      TAVILY_API_KEY: ''
      MUSE_API_KEY: ''
      API_PORT: '8798'
      UI_PORT: '5198'
      MAILDEV_UI_PORT: '1098'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify exact dispatched head
        run: test "$(git rev-parse HEAD)" = '${{ github.sha }}'
      - uses: docker/setup-buildx-action@v4
      - name: Validate workflow selection and publication guards
        run: make test-publishable-manifests SCOPE=scripts/ci/publishable-ci-wiring.test.mjs ci-capacity-policy test-ci-expected-results ENV=test-decision-h1
      - name: API typecheck, lint and isolated stack
        run: make typecheck-api lint-api up-api-test ENV=test-decision-h1
      - name: Decision host, HTTP, migration and metering regressions
        run: >-
          make test-api-unit
          SCOPE="tests/unit/decision-host.test.ts tests/unit/decision-route.test.ts
          tests/unit/llm-budget-admission-native.test.ts tests/unit/gateway-package-version.test.ts
          tests/api/decision-api.test.ts
          tests/api/decision-metering.test.ts tests/api/llm-admission-schema.test.ts
          tests/api/llm-budget-ledger.test.ts" ENV=test-decision-h1
      - name: Build shipped API
        run: make build-api-image-fresh ENV=test-decision-h1
      - name: Validate llm-mesh
        run: make typecheck-llm-mesh lint-llm-mesh test-llm-mesh ENV=test-decision-h1
      - name: Validate cluster Decision composition and receipts
        run: make test-cluster-mesh SCOPE=tests/decision- ENV=test-decision-h1
      - name: Tear down isolated services
        if: always()
        run: make down ENV=test-decision-h1
      - name: Record validation boundary
        if: always()
        run: echo 'Decision fixture validation only; ordinary merge CI and live qualification remain outstanding.' >> "$GITHUB_STEP_SUMMARY"

  enforce-package-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check version bump for packages with src changes
        env:
          BASE: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git fetch origin "$BASE" >/dev/null 2>&1
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          mkdir -p tmp/engram-e2-bump
          printf 'base=%s\nbase-sha=%s\nmerge-base=%s\nhead=%s\n' "$BASE" "$BASE_SHA" "$MERGE_BASE" "$HEAD_SHA" | tee tmp/engram-e2-bump/context.txt
          sha256sum packages/cluster-mesh/package.json package-lock.json > tmp/engram-e2-bump/manifest-lock.sha256
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
          FAIL=""
          for pkg_dir in packages/*/; do
            [ -d "$pkg_dir" ] || continue
            pkg="$(basename "$pkg_dir")"
            # Skip if no src/ changes for this package in the PR diff
            if ! printf '%s\n' "$CHANGED" | grep -qE "^packages/${pkg}/src/"; then
              continue
            fi
            # Skip private packages (not published)
            is_private="$(node -p "JSON.parse(require('fs').readFileSync('packages/${pkg}/package.json','utf8')).private===true" 2>/dev/null || echo false)"
            if [ "$is_private" = "true" ]; then
              echo "::notice::packages/${pkg} is private — skipping bump check"
              continue
            fi
            OLD="$(git show "$MERGE_BASE:packages/${pkg}/package.json" 2>/dev/null | grep -m1 '"version"' | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/' || true)"
            NEW="$(grep -m1 '"version"' "packages/${pkg}/package.json" | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/')"
            # If OLD missing, package is new — bootstrap path covers it; skip
            if [ -z "$OLD" ]; then
              echo "::notice::packages/${pkg} appears new (no base version) — skipping bump check"
              continue
            fi
            if [ "$OLD" = "$NEW" ]; then
              echo "::error::packages/${pkg} has changes under src/ but version is unchanged ($OLD). Bump packages/${pkg}/package.json version (semver) before merging. See rules/workflow.md → Package publication."
              FAIL="$FAIL ${pkg}($OLD)"
            else
              echo "::notice::packages/${pkg}: $OLD -> $NEW ✓"
            fi
          done
          if [ -n "$FAIL" ]; then
            echo "::error::Missing version bumps:$FAIL"
            exit 1
          fi
          echo "All touched packages have bumped versions."
      - name: Retain actual-base bump receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-bump-receipt
          path: tmp/engram-e2-bump/**
          retention-days: 30

  qualify-engram-e2:
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.engram_e2 == 'true'
    permissions:
      contents: read
      actions: read
    env:
      E2_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      E2_HEAD_REF: ${{ github.head_ref }}
      E2_PR_URL: ${{ github.event.pull_request.html_url }}
      E2_LOCK: /tmp/sentropic-docker.lock
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Qualify exact E2 head with retained Make receipts
        run: make engram-e2-qualify ENV=test-e2-int
      - name: Prepare approved dev.7 E11 proof independently of the stable head
        run: make -f Makefile -f tools/engram-e11/e11.mk memory-e11-reviewed-prepare ENV=test-e2-int
      - name: Qualify E11 installed tuple and run generator checks
        working-directory: tmp/engram-e11-reviewed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make -f Makefile -f tools/engram-e11/e11.mk memory-e11-prepare ENV=test-e2-int
          flock "$E2_LOCK" make -f Makefile -f tools/engram-e11/e11.mk memory-e11-lock ENV=test-e2-int
          flock "$E2_LOCK" make -f Makefile -f tools/engram-e11/e11.mk memory-e11-installed ENV=test-e2-int
          make -f Makefile -f tools/engram-e11/e11.mk memory-e11-snapshot ENV=test-e2-int
          flock "$E2_LOCK" make -f Makefile -f tools/engram-e11/e11.mk memory-e11-generate memory-e11-test memory-e11-check ENV=test-e2-int
      - name: Qualify stable E10 installed memory and two-process reopen
        run: make -f Makefile -f packages/cluster-mesh/tests/engram-memory/qualification.mk installed-memory INSTALLED_ENGRAM_TGZ="$PWD/tmp/engram-e11-reviewed/tmp/engram-e11-current/engram.tgz" ENV=test-e2-int
      - name: Retain job URLs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: make engram-e2-job-receipt ENV=test-e2-int
      - name: Remove disposable E2 Compose project
        if: always()
        run: flock "$E2_LOCK" make down ENV=test-e2-int
      - name: Upload E2 qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engram-e2-${{ github.event.pull_request.head.sha }}
          path: |
            tmp/engram-e2-receipts/**
            tmp/memory-stage-b/**
            tmp/engram-e11-current/**
            tmp/engram-e11-reviewed/tmp/engram-e2-receipts/**
            tmp/engram-e11-reviewed/tmp/engram-e11-current/**
            tmp/installed-memory-e10/**
            '!tmp/**/node_modules/**'
          retention-days: 30
          if-no-files-found: error

  changes:
    if: inputs.decision_fixtures_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      expected_attempt: ${{ steps.ci_expected.outputs.attempt }}
      global: ${{ steps.filter.outputs.global }}
      idp_sync: ${{ steps.filter.outputs.idp_sync }}
      api: ${{ steps.filter.outputs.api }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      workers: ${{ steps.filter.outputs.workers }}
      ui: ${{ steps.filter.outputs.ui }}
      ai: ${{ steps.filter.outputs.ai }}
      llm_mesh: ${{ steps.filter.outputs.llm_mesh }}
      cluster_mesh: ${{ steps.filter.outputs.cluster_mesh }}
      engram_e2: ${{ steps.engram_e2_scope.outputs.selected }}
      cluster_mesh_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.cluster_mesh_publish }}
      llm_gateway: ${{ steps.filter.outputs.llm_gateway }}
      chat_ui: ${{ steps.filter.outputs.chat_ui }}
      cited_source_viewer: ${{ steps.filter.outputs.cited_source_viewer }}
      cowork_bridge: ${{ steps.filter.outputs.cowork_bridge }}
      cowork_bridge_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.cowork_bridge_publish }}
      cowork_desktop: ${{ steps.filter.outputs.cowork_desktop }}
      cowork_desktop_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.cowork_desktop_publish }}
      oauth_verify: ${{ steps.filter.outputs.oauth_verify }}
      mcp_auth: ${{ steps.filter.outputs.mcp_auth }}
      mcp_platform: ${{ steps.filter.outputs.mcp_platform }}
      memory_l5: ${{ steps.filter.outputs.memory_l5 }}
      auth_hono: ${{ steps.filter.outputs.auth_hono }}
      auth_client: ${{ steps.filter.outputs.auth_client }}
      auth_ui: ${{ steps.filter.outputs.auth_ui }}
      chat_core: ${{ steps.filter.outputs.chat_core }}
      chat_server: ${{ steps.filter.outputs.chat_server }}
      comments: ${{ steps.filter.outputs.comments }}
      skills: ${{ steps.filter.outputs.skills }}
      events: ${{ steps.filter.outputs.events }}
      contracts: ${{ steps.filter.outputs.contracts }}
      flow: ${{ steps.filter.outputs.flow }}
      artifacts: ${{ steps.filter.outputs.artifacts }}
      llm_mesh_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.llm_mesh_publish }}
      llm_gateway_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.llm_gateway_publish }}
      chat_ui_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.chat_ui_publish }}
      cited_source_viewer_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.cited_source_viewer_publish }}
      oauth_verify_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.oauth_verify_publish }}
      mcp_auth_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.mcp_auth_publish }}
      mcp_platform_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.mcp_platform_publish }}
      auth_hono_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.auth_hono_publish }}
      auth_client_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.auth_client_publish }}
      auth_ui_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.auth_ui_publish }}
      chat_core_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.chat_core_publish }}
      chat_server_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.chat_server_publish }}
      comments_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.comments_publish }}
      events_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.events_publish }}
      contracts_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.contracts_publish }}
      flow_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.flow_publish }}
      artifacts_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.artifacts_publish }}
      harness: ${{ steps.filter.outputs.harness }}
      live_speech: ${{ steps.filter.outputs.live_speech }}
      harness_publish: ${{ inputs.capacity_publish_dry_run && 'true' || steps.filter.outputs.harness_publish }}
      manifest_guard: ${{ steps.filter.outputs.manifest_guard }}
      # Publishable manifest guard context (spec section 6): JSON lists, never booleans.
      package_files: ${{ steps.publishable_files.outputs.publishable_package_files_files }}
      matched_filters: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
      # Enforces the "Keep `api` and `ui` in sync with API_VERSION / UI_VERSION"
      # note below. That invariant was a comment, so nothing caught a drift: a
      # path feeding the content-sha but missing from the filter skips publish
      # while moving the deployed tag. Runs in `changes` (always executed, already
      # checked out) so it costs no extra runner.
      - name: Assert change-filters cover the image content-hash inputs
        run: make check-ci-version-filters
      - name: Assert every numbered E2E spec has a CI lane
        run: make check-e2e-inventory
      # Release train lock-sync (BRDP-EX10): a train package whose manifest version differs from its
      # root lockfile workspace entry fails `changes`, which blocks every publisher (barrier below).
      - name: Assert train package versions match the root lockfile
        run: |
          set -eu
          for slug in llm-mesh llm-gateway cluster-mesh; do
            manifest="$(jq -r '.version' "packages/${slug}/package.json")"
            locked="$(jq -r --arg key "packages/${slug}" '.packages[$key].version // "missing"' package-lock.json)"
            if [ "$manifest" != "$locked" ]; then
              echo "::error title=Train lock-sync::packages/${slug}/package.json version ${manifest} differs from package-lock.json packages/${slug} version ${locked}; refresh the root lockfile through Make"
              exit 1
            fi
            echo "lock-sync ok: ${slug}@${manifest}"
          done
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engram_e2:
              - 'packages/cluster-mesh/**'
              - 'tools/engram-e11/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            idp_sync:
              - 'deploy/**'
              - 'packages/auth-hono/src/**'
              - 'packages/auth-hono/package.json'
              - 'api/drizzle/*.sql'
              - 'Makefile'
              - '.github/workflows/idp-identity-sync.yml'
              - '.github/workflows/idp-workload-secret.yml'
              - '.github/workflows/ci.yml'
            global:
              - 'Makefile'
              - 'docker-compose.yml'
              - 'docker-compose.test.yml'
              - 'docker-compose.ci.yml'
              - 'tools/**'
              - 'scripts/test-api-tooling.sh'
              - 'scripts/ci/image-receipt.mjs'
              - 'scripts/ci/image-receipt.test.mjs'
              - 'scripts/publish-api-image.sh'
              - 'scripts/test-api-tag-guard.sh'
              - 'scripts/resolve-api-image.sh'
              - 'scripts/test-api-image-canonical.sh'
              - 'scripts/test-pgbackup-restore-isolation.sh'
              - '.github/workflows/ci.yml'
              - 'e2e/**'
            # Keep `api` and `ui` in sync with the API_VERSION / UI_VERSION content-sha inputs
            # in the Makefile. Those shas are the immutable image tags that publish-{api,ui}-image
            # push and that deploy-preprod pins. A path that feeds the sha but is missing here
            # bumps the pinned tag without ever building it -> ImagePullBackOff on preprod.
            api:
              - 'api/**'
              - 'apps/auth-idp/**'
              - 'apps/llm-gateway/**'
              - 'package.json'
              - 'package-lock.json'
              - 'ui/package.json'
              - '.dockerignore'
              - '.security/audit-gate.mjs'
              - '.security/audit-allowlist.json'
              - 'packages/artifacts/**'
              - 'packages/auth-client/**'
              - 'packages/auth-hono/**'
              - 'packages/auth-ui/**'
              - 'packages/chat-core/**'
              - 'packages/chat-server/**'
              - 'packages/cluster-mesh/**'
              - 'packages/comments/**'
              - 'packages/connector-host/**'
              - 'packages/contracts/**'
              - 'packages/events/**'
              - 'packages/flow/**'
              - 'packages/llm-gateway/**'
              - 'packages/llm-mesh/**'
              - 'packages/mcp-auth/**'
              - 'packages/mcp-connector-google/**'
              - 'packages/mcp-platform/**'
              - 'packages/oauth-verify/**'
              - 'packages/skills/**'
              - 'packages/ubo-contracts/**'
            ui:
              - 'ui/**'
              - 'packages/chat-ui/**'
              - 'packages/cowork-desktop/**'
              - 'packages/cowork-bridge/**'
            llm_mesh:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-mesh/**'
              - '.github/workflows/ci.yml'
            cluster_mesh:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cluster-mesh/**'
              - '.github/workflows/ci.yml'
            cluster_mesh_publish:
              - 'packages/cluster-mesh/**'
            llm_gateway:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-gateway/**'
              - 'packages/llm-mesh/**'
              - '.github/workflows/ci.yml'
            llm_mesh_publish:
              - 'packages/llm-mesh/**'
            llm_gateway_publish:
              - 'packages/llm-gateway/**'
            chat_ui:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-ui/**'
              - '.github/workflows/ci.yml'
            chat_ui_publish:
              - 'packages/chat-ui/**'
            cited_source_viewer:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cited-source-viewer/**'
              - '.github/workflows/ci.yml'
            cited_source_viewer_publish:
              - 'packages/cited-source-viewer/**'
            cowork_bridge:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-bridge/**'
              - '.github/workflows/ci.yml'
            cowork_bridge_publish:
              - 'packages/cowork-bridge/**'
            cowork_desktop:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-desktop/**'
              - 'packages/cowork-bridge/**'
              - 'packages/chat-ui/**'
              - '.github/workflows/ci.yml'
            cowork_desktop_publish:
              - 'packages/cowork-desktop/**'
            oauth_verify:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/oauth-verify/**'
              - '.github/workflows/ci.yml'
            oauth_verify_publish:
              - 'packages/oauth-verify/**'
            mcp_auth:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/mcp-auth/**'
              - 'packages/oauth-verify/**'
              - '.github/workflows/ci.yml'
            mcp_auth_publish:
              - 'packages/mcp-auth/**'
            mcp_platform:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/mcp-platform/**'
              - '.github/workflows/ci.yml'
            mcp_platform_publish:
              - 'packages/mcp-platform/**'
            memory_l5:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/mcp-platform/**'
              - 'packages/mcp-broker/**'
              - 'packages/cluster-mesh/**'
              - 'tools/memory-mcp-l5/**'
              - '.github/workflows/ci.yml'
            auth_hono:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-hono/**'
              - 'packages/oauth-verify/**'
              - '.github/workflows/ci.yml'
            auth_hono_publish:
              - 'packages/auth-hono/**'
            auth_client:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
