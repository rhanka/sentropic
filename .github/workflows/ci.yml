        run: make pack-llm-gateway PACK_DESTINATION=tmp/ci-manifest-guard/candidate/llm-gateway ENV=test-ci-llm-gateway
      - name: Upload verified LLM Gateway candidate
        uses: actions/upload-artifact@v4
