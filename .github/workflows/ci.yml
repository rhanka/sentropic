  test-api-unit-integration:
    runs-on: ubuntu-latest
    needs: [changes, build-api-image, build-api-tool-image]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    continue-on-error: ${{ matrix.suite == 'ai' }}
    env:
      API_TEST_CI: '1'
      API_TEST_SUT: ${{ (matrix.suite == 'smoke' || matrix.suite == 'limit') && '1' || '0' }}
      DISABLE_RATE_LIMIT: ${{ matrix.suite == 'limit' && 'false' || 'true' }}
      API_PORT: '9491'
      UI_PORT: '5691'
      MAILDEV_UI_PORT: '1591'
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        include:
          - suite: smoke
          - suite: unit
          - suite: queue
          - suite: ai
            ai_specs: "chat-sync,executive-summary-auto,comment-assistant"
          - suite: ai
            ai_specs: "initiative-generation-async,executive-summary-sync"
          - suite: ai
            ai_specs: "chat-tools,company-enrichment-sync,documents-tool,initiative-generation-sync"
          - suite: security
          - suite: limit
          # BR70-CI1: the foundation data-spine test dirs (BR-52 artifact-store /
          # BR-59 object-registry / BR-60 outbox) were green-by-absence — no matrix
          # suite ran them. Each resolves via the test-api-% Makefile pattern to the
          # per-dir npm script added in api/package.json. (`tests/services/` is a
          # cross-lane grab-bag — catalog/flow/chat — NOT foundation, routed to its
          # owning lanes separately, so it is intentionally not wired here.)
          - suite: artifact-store
          - suite: object-registry
          - suite: outbox
          - suite: endpoints
            endpoints_shard: 1
          - suite: endpoints
            endpoints_shard: 2
          - suite: endpoints
            endpoints_shard: 3
          - suite: endpoints
            endpoints_shard: 4
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Download CI toolbox
        uses: actions/download-artifact@v7
        with:
          name: api-tool-image
          path: .
      - name: Load CI toolbox
        run: make load-api-tool ENV=test-ci-api
      - name: Download API image artifact
        if: matrix.suite == 'smoke' || matrix.suite == 'limit'
        uses: actions/download-artifact@v7
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        if: matrix.suite == 'smoke' || matrix.suite == 'limit'
        run: make load-api ENV=test-ci-api
      - name: Start API test stack
        run: |
          if [ "$API_TEST_SUT" = 1 ]; then
            make up-api-sut ENV=test-ci-api
          else
            make up-api-test-ci ENV=test-ci-api
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }} # BR75-EX4
      - name: Test API gateway package version evidence
        if: matrix.suite == 'unit'
        run: make test-api-unit SCOPE=tests/unit/gateway-package-version.test.ts ENV=test-ci-api
      - name: Test API (${{ matrix.suite }})
        run: |
          if [ "${{ matrix.suite }}" = "endpoints" ]; then
            make test-api-endpoints API_TEST_WORKERS=1 API_TEST_ARGS="--shard=${{ matrix.endpoints_shard }}/4" ENV=test-ci-api
          elif [ "${{ matrix.suite }}" = "ai" ] && [ -n "${{ matrix.ai_specs }}" ]; then
            SPECS=$(echo "${{ matrix.ai_specs }}" | tr ',' ' ' | xargs -I{} echo "tests/ai/{}.test.ts" | tr '\n' ' ')
            make test-api-ai SCOPE="$SPECS" API_TEST_WORKERS=1 ENV=test-ci-api
          else
            make test-api-${{ matrix.suite }} ENV=test-ci-api
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }} # BR75-EX4
      - name: Show API logs on failure
        if: failure()
        run: make logs-api-ci ENV=test-ci-api
      - name: Tear down API test stack
        if: always()
        run: make down-api-ci ENV=test-ci-api

