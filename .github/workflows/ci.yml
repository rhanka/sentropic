              - 'package-lock.json'
              - 'packages/mcp-platform/**'
            auth_hono:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-hono/**'
              - 'packages/oauth-verify/**'
              - '.github/workflows/ci.yml'
            auth_hono_publish:
