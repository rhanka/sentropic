  # BR-55c (ARCH-17): main -> PREPROD continuous deploy. REPLACES the legacy
  # prod-targeting deploy-k8s job — NO main merge can touch the `sentropic` (prod)
  # namespace any more. Prod deploys ONLY via the gated release-prod (BR-55d:
  # GitHub production Environment + rhanka reviewer). This job uses the
  # preprod-scoped KUBE_CONFIG_DATA_PREPROD (poc-k8s; a namespace-scoped kubeconfig
  # that can ONLY write the sentropic-preprod ns — the prod ns is RBAC-denied), and
  # `make k8s-deploy-preprod` pins the immutable content-hash image tags into
  # overlays/preprod before applying (kills the floating :main staleness, D-c1).
  deploy-preprod:
    runs-on: ubuntu-latest
    needs: [publish-api-image, publish-ui-image]
    # Deploy on every main merge. Run even when the publish jobs were SKIPPED (no
    # api/ui content change) so an overlay/manifest-only change still reaches preprod;
    # only skip if a publish job actually FAILED.
    if: >-
      always() && github.ref == 'refs/heads/main' && !cancelled()
      && needs.publish-api-image.result != 'failure'
      && needs.publish-ui-image.result != 'failure'
    steps:
      - uses: actions/checkout@v6
      - name: Decode the preprod kubeconfig from secret
        env:
          KUBE_CONFIG_DATA_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: |
          set -eu
          if [ -z "${KUBE_CONFIG_DATA_PREPROD:-}" ]; then
            echo "::error::GH secret KUBE_CONFIG_DATA_PREPROD is missing or empty (poc-k8s preprod kubeconfig)."
            exit 1
          fi
          printf '%s' "${KUBE_CONFIG_DATA_PREPROD}" | base64 -d > kubeconfig-preprod.yaml
          chmod 600 kubeconfig-preprod.yaml
      - name: Assert both images exist at the registry before deploy (fail loud, never ImagePullBackOff)
        env:
          DOCKER_USERNAME: nologin
          DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          set -eu
          # k8s-deploy-preprod (next step) pins the immutable content-hash tags
          # sentropic-api:$(API_VERSION) + sentropic-ui:$(UI_VERSION) into overlays/preprod.
          # If either tag was never pushed (publish skipped/failed, or a tag mismatch), a
          # kubectl apply would leave preprod in ImagePullBackOff and the cluster is the
          # first to notice. This is a control that PREVENTS: assert both manifests exist
          # in the registry first (docker manifest inspect via check-{api,ui}-image) and
          # fail this job with a clear error, rather than deploying an unverified reference.
          make check-api-image check-ui-image
      - name: Deploy to the sentropic-preprod namespace (immutable image pin)
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig-preprod.yaml
        run: |
          set -eu
          make k8s-deploy-preprod KUBECONFIG="${KUBECONFIG}" ENV=ci-preprod
