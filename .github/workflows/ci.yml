              - 'packages/auth-client/**'
              - '.github/workflows/ci.yml'
            auth_client_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-client/**'
            auth_ui:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-ui/**'
              - '.github/workflows/ci.yml'
            auth_ui_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-ui/**'
            chat_core:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-core/**'
              - 'packages/events/**'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            chat_core_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-core/**'
            chat_server:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-server/**'
              - '.github/workflows/ci.yml'
            chat_server_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-server/**'
            comments:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/comments/**'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            comments_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/comments/**'
            events:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/events/**'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            events_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/events/**'
            contracts:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            contracts_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/contracts/**'
            flow:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/flow/**'
              - '.github/workflows/ci.yml'
            flow_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/flow/**'
            build_cli:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/build-cli/**'
              - '.github/workflows/ci.yml'
            harness:
