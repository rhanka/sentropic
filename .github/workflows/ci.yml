    if: (needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true') && github.ref == 'refs/heads/main'
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      UI_IMAGE_NAME: sentropic-ui
    steps:
      - uses: actions/checkout@v6
      - name: Check if UI image is up to date
        id: image-check
        run: make check-ui-image
        continue-on-error: true
      - name: Download UI image artifact
        if: steps.image-check.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: ui-image
          path: .
      - name: Load UI image from artifact
        if: steps.image-check.outcome == 'failure'
        run: make load-ui
      - name: Publish UI image
        if: steps.image-check.outcome == 'failure'
        run: make publish-ui-image
      - name: Push main alias tag (UI)
        run: |
          set -eu
          ALIAS="main"
          UI_VERSION="$(make -s version | awk '/^UI_VERSION:/ {print $2}')"
          # Ensure canonical tag is present locally (it may not be if image-check passed)
          docker pull "${REGISTRY}/${UI_IMAGE_NAME}:${UI_VERSION}"
          docker tag  "${REGISTRY}/${UI_IMAGE_NAME}:${UI_VERSION}" "${REGISTRY}/${UI_IMAGE_NAME}:${ALIAS}"
          docker push "${REGISTRY}/${UI_IMAGE_NAME}:${ALIAS}"

