              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-bridge/**'
              - '.github/workflows/ci.yml'
            cowork_bridge_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-bridge/**'
            cowork_desktop:
