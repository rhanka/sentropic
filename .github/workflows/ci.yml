              - 'packages/build-cli/**'
              - '.github/workflows/ci.yml'
            cli_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cli/**'

  # Build E2E Docker image
  build-e2e:
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Check if E2E image is up to date
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        id: check-e2e-image
        run: make check-e2e-image
        continue-on-error: true
      - name: Build e2e image
        if: steps.check-e2e-image.outcome == 'failure' && (needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true')
        run: make build-e2e
      - name: Publish API image
        if: steps.check-e2e-image.outcome == 'failure' && (needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true')
        run: make publish-e2e-image

  typecheck-lint-ui:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Typecheck UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make typecheck-ui
      - name: Lint UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make lint-ui

  typecheck-lint-api:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Typecheck API
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make typecheck-api
      - name: Typecheck IdP
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make typecheck-idp
      - name: Typecheck IdP screens front
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make typecheck-idp-web
      - name: Build IdP screens front
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make build-idp-web
      - name: Lint API
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make lint-api

  validate-llm-mesh:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.llm_mesh == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck LLM Mesh
        run: make typecheck-llm-mesh
      - name: Test LLM Mesh
        run: make test-llm-mesh
      - name: Build LLM Mesh
        run: make build-llm-mesh
      - name: Pack LLM Mesh
        run: make pack-llm-mesh

  # BR-LB-EX1 — @sentropic/llm-gateway (WP16 Layer-B) CI validation (owner-approved
  # 2026-06-22). Mirrors validate-llm-mesh; the make targets build the sibling
  # @sentropic/llm-mesh dist first (the gateway depends on it). No publish job here —
