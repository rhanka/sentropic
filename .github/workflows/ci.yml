  # Build API Docker image (independent from API tests)
  build-api-image:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build API image
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make build-api
      - name: Save API image as artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make save-api
      - name: Upload API image artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: api-image
          path: api-image.tar

  test-api-unit-integration:
    runs-on: ubuntu-latest
    needs: [changes, build-api-image]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
          - suite: unit
          - suite: queue
          - suite: ai
            ai_specs: "chat-sync,executive-summary-auto,comment-assistant"
          - suite: ai
            ai_specs: "initiative-generation-async,executive-summary-sync"
          - suite: ai
            ai_specs: "chat-tools,company-enrichment-sync,documents-tool,initiative-generation-sync"
          - suite: security
          - suite: limit
          # BR70-CI1: the foundation data-spine test dirs (BR-52 artifact-store /
          # BR-59 object-registry / BR-60 outbox) were green-by-absence — no matrix
          # suite ran them. Each resolves via the test-api-% Makefile pattern to the
          # per-dir npm script added in api/package.json. (`tests/services/` is a
          # cross-lane grab-bag — catalog/flow/chat — NOT foundation, routed to its
          # owning lanes separately, so it is intentionally not wired here.)
          - suite: artifact-store
          - suite: object-registry
          - suite: outbox
          - suite: endpoints
            endpoints_shard: 1
          - suite: endpoints
            endpoints_shard: 2
          - suite: endpoints
            endpoints_shard: 3
          - suite: endpoints
            endpoints_shard: 4
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Download API image artifact
        uses: actions/download-artifact@v7
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        run: make load-api
      - name: Start API test stack
        run: make up-api-test-ci
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Test API (${{ matrix.suite }})
        run: |
          if [ "${{ matrix.suite }}" = "endpoints" ]; then
            make test-api-endpoints API_TEST_WORKERS=1 API_TEST_ARGS="--shard=${{ matrix.endpoints_shard }}/4"
          elif [ "${{ matrix.suite }}" = "ai" ] && [ -n "${{ matrix.ai_specs }}" ]; then
            SPECS=$(echo "${{ matrix.ai_specs }}" | tr ',' ' ' | xargs -I{} echo "tests/ai/{}.test.ts" | tr '\n' ' ')
            make test-api-ai SCOPE="$SPECS" API_TEST_WORKERS=1
          else
            make test-api-${{ matrix.suite }}
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Show API logs on failure
        if: failure()
        run: make logs-api

  # Build & Unit Test UI
  build-ui:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build Chrome extension target
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make build-ext-chrome
      - name: Build VSCode extension target
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make build-ext-vscode
      - name: Build Cowork desktop binary
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make package-desktop-windows
      - name: Build UI image
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make build-ui-image
      - name: Save UI image as artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make save-ui
      - name: Test UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ui
      - name: Upload UI image artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-image
          path: ui-image.tar
      - name: Build UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make build-ui
        env:
          VITE_API_BASE_URL: https://sentropic.sent-tech.ca/api/v1
      - name: Upload static files as artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: ui/build/

  test-e2e:
    runs-on: ubuntu-latest
    needs: [changes, typecheck-lint-ui, typecheck-lint-api, build-api-image, build-ui, build-e2e, security-sast-sca]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: group-a
            e2e_groups: "00 02 06"
          - group: group-b
            e2e_groups: "01 04"
          - group: group-c
            e2e_groups: "03"
          - group: group-d
            e2e_groups: "08"
          - group: group-e
            e2e_groups: "05 07"
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Pull if API image is up to date
        id: check-api-image
        run: make pull-api-image
        continue-on-error: true
      - name: Download API image artifact
        if: steps.check-api-image.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: api-image
          path: .
      - name: Load UI image from artifact
        if: steps.check-ui-image.outcome == 'failure'
        run: make load-ui
      - name: Pull if UI image is up to date
        id: check-ui-image
        run: make pull-ui-image
        continue-on-error: true
      - name: Download UI image artifact
        if: steps.check-ui-image.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: ui-image
          path: .
      - name: Load API image from artifact
        if: steps.check-api-image.outcome == 'failure'
        run: make load-api
      - name: Pull e2e image artifact
        run: make pull-e2e-image
      - name: Test e2e API & UI (${{ matrix.group }})
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          E2E_GROUPS: ${{ matrix.e2e_groups }}
        run: make test-e2e

  e2e-vscode:
    runs-on: ubuntu-latest
    needs: [changes, typecheck-lint-ui, typecheck-lint-api, build-api-image, build-ui, build-e2e, security-sast-sca]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      E2E_SPEC: tests/vscode/01-vscode-chat-streaming.spec.ts
      OPENVSCODE_PORT: 3115
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Pull if API image is up to date
        id: check-api-image-vscode
        run: make pull-api-image
        continue-on-error: true
      - name: Download API image artifact
        if: steps.check-api-image-vscode.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        if: steps.check-api-image-vscode.outcome == 'failure'
        run: make load-api
      - name: Pull if UI image is up to date
        id: check-ui-image-vscode
        run: make pull-ui-image
        continue-on-error: true
      - name: Download UI image artifact
        if: steps.check-ui-image-vscode.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: ui-image
          path: .
      - name: Load UI image from artifact
        if: steps.check-ui-image-vscode.outcome == 'failure'
        run: make load-ui
      - name: Pull e2e image artifact
        run: make pull-e2e-image
      - name: Test VSCode E2E lane
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: make test-e2e-vscode
      - name: Upload VSCode E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vscode-results
          path: e2e/test-results/
          retention-days: 7

  # BR-39r (L2 guard) — screen-driven SSO smoke for the standalone IdP. Drives
  # the IdP-SERVED login + consent screens in headless Chromium and clicks the
  # real Approve button, asserting the native-form POST yields a server 302 to
  # the RP redirect_uri with an authorization code. This is the guard that was
  # missing when the JS-dependent consent navigation regressed in prod: a green
  # API/unit suite never exercised the served consent screen end-to-end.
  smoke-idp-screens:
    runs-on: ubuntu-latest
    needs: [changes, typecheck-lint-api, build-api-image, build-e2e, security-sast-sca]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      DISABLE_RATE_LIMIT: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Pull if API image is up to date
        id: check-api-image-idp
        run: make pull-api-image
        continue-on-error: true
      - name: Download API image artifact
        if: steps.check-api-image-idp.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        if: steps.check-api-image-idp.outcome == 'failure'
        run: make load-api
      - name: Pull e2e image artifact
        run: make pull-e2e-image
      - name: Start standalone IdP (screens + API on shared DB)
        run: make dev-idp
      - name: Screen-driven SSO smoke (served login + consent screens)
        run: make smoke-idp-screens
      - name: IdP logs on failure
        if: failure()
        run: make logs-idp-once
      - name: Tear down IdP overlay
        if: always()
        run: make down-idp

  # Security: SAST and SCA scans (code and dependencies)
  security-sast-sca:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Run SAST scan on API
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make test-api-security-sast
        continue-on-error: false
      - name: Run SCA scan on API
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make test-api-security-sca
        continue-on-error: false
      - name: Run SAST scan on UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ui-security-sast
        continue-on-error: false
      - name: Run SCA scan on UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ui-security-sca
        continue-on-error: false
      - name: Upload security scan results (SAST/SCA)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-sast-sca-results
          path: |
            .security/sast-*.json
            .security/sast-*-parsed.yaml
            .security/sca-*.json
            .security/sca-*-parsed.yaml
          retention-days: 30

  # Security: IaC scans (infrastructure configuration)
  security-iac:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Run IaC security scan
        run: make test-security-iac
        continue-on-error: false
      - name: Upload security scan results (IaC)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-iac-results
          path: |
            .security/iac-infra.json
            .security/iac-infra-parsed.yaml
          retention-days: 30

  # Security: Container scans (Docker images)
  security-container:
    runs-on: ubuntu-latest
    needs: [changes, build-api-image, build-ui]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Download API image artifact
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: actions/download-artifact@v7
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make load-api
      - name: Download UI image artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        uses: actions/download-artifact@v7
        with:
          name: ui-image
          path: .
      - name: Load UI image from artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make load-ui
      - name: Run container scan on API
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make test-api-security-container
        continue-on-error: false
      - name: Run container scan on UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ui-security-container
        continue-on-error: false
      - name: Upload security scan results (Container)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-container-results
          path: |
            .security/container-*.json
            .security/container-*-parsed.yaml
          retention-days: 30

  test-smoke-restore:
    runs-on: ubuntu-latest
    needs: [changes, build-api-image, build-ui, build-e2e, security-sast-sca]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Backup production database (k8s in-cluster postgres)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -eu
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::GH secret KUBECONFIG_B64 is missing or empty."
            exit 1
          fi
          printf '%s' "${KUBECONFIG_B64}" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml
          make db-backup-prod KUBECONFIG="$PWD/kubeconfig.yaml"
      - name: Test restore and smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
