  # Build API Docker image (independent from API tests)
  build-api-image:
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Build API image
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make ci-build-api ENV=test-ci-images
      - name: Test image receipt integrity and input guards
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ci-image-receipts ENV=test-ci-images
      - name: Verify npm CLI and cache are absent from the production runtime
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ci-api-runtime ENV=test-ci-api
      - name: Test publish-api-image tag-collision guard
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ci-api-tag-guard ENV=test-ci-api
      - name: Test pgbackup restore isolation guards
        if: needs.changes.outputs.global == 'true'
        run: make test-pgbackup-restore-isolation ENV=test-ci-restore-guard
      - name: Test canonical API image artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ci-api-image-canonical ENV=test-ci-api
      - name: Save API image as artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make save-api
      - name: Upload API image artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: api-image
          retention-days: 1
          path: |
            api-image.tar.zst
            api-image.json
            .tmp/ci-prod-image/api-image-id
          include-hidden-files: true
