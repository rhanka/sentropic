    needs: [changes, validate-chat-server]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.validate-chat-server.result == 'success' && (needs.changes.outputs.chat_server_publish == 'true' && (github.ref == 'refs/heads/main' || inputs.capacity_publish_dry_run == true))
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Dry-run package publication
        if: inputs.capacity_publish_dry_run == true
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make ci-capacity-publish-dry-run PACKAGE=chat-server ENV=test-ci-capacity
      - name: Publish Chat Server
        if: inputs.capacity_publish_dry_run != true
        run: make publish-chat-server

  publish-comments:
    runs-on: ubuntu-latest
    needs: [changes, validate-comments]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.validate-comments.result == 'success' && (needs.changes.outputs.comments_publish == 'true' && (github.ref == 'refs/heads/main' || inputs.capacity_publish_dry_run == true))
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Dry-run package publication
        if: inputs.capacity_publish_dry_run == true
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make ci-capacity-publish-dry-run PACKAGE=comments ENV=test-ci-capacity
      - name: Publish Comments
        if: inputs.capacity_publish_dry_run != true
        run: make publish-comments

  publish-flow:
    runs-on: ubuntu-latest
    needs: [changes, validate-flow]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.validate-flow.result == 'success' && (needs.changes.outputs.flow_publish == 'true' && (github.ref == 'refs/heads/main' || inputs.capacity_publish_dry_run == true))
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Dry-run package publication
        if: inputs.capacity_publish_dry_run == true
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make ci-capacity-publish-dry-run PACKAGE=flow ENV=test-ci-capacity
      - name: Publish Flow
        if: inputs.capacity_publish_dry_run != true
        run: make publish-flow

  publish-harness:
    runs-on: ubuntu-latest
    needs: [changes, validate-harness]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.validate-harness.result == 'success' && (needs.changes.outputs.harness_publish == 'true' && (github.ref == 'refs/heads/main' || inputs.capacity_publish_dry_run == true))
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Dry-run package publication
        if: inputs.capacity_publish_dry_run == true
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make ci-capacity-publish-dry-run PACKAGE=harness ENV=test-ci-capacity
      - name: Publish Harness
        if: inputs.capacity_publish_dry_run != true
        run: make publish-harness

  # N1: cluster-mesh depends on @sentropic/events and @sentropic/contracts; wait for both.
  # Release train (BRDP-EX10): also the last link after llm-mesh and llm-gateway; an upstream
  # publisher counts as skipped only when its own `*_publish` filter is false.
  publish-cluster-mesh:
    runs-on: ubuntu-latest
    needs: [changes, validate-llm-mesh, validate-llm-gateway, validate-cluster-mesh, publish-llm-mesh, publish-llm-gateway, publish-events, publish-contracts, publish-mcp-platform, publish-artifacts]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (github.ref == 'refs/heads/main' || inputs.capacity_publish_dry_run == true) &&
      needs.changes.outputs.cluster_mesh_publish == 'true' &&
      (needs.validate-llm-mesh.result == 'success' || (needs.validate-llm-mesh.result == 'skipped' && needs.changes.outputs.llm_mesh != 'true' && needs.changes.outputs.global != 'true')) &&
      (needs.validate-llm-gateway.result == 'success' || (needs.validate-llm-gateway.result == 'skipped' && needs.changes.outputs.llm_gateway != 'true' && needs.changes.outputs.global != 'true')) &&
      (needs.validate-cluster-mesh.result == 'success' || (needs.validate-cluster-mesh.result == 'skipped' && needs.changes.outputs.cluster_mesh != 'true' && needs.changes.outputs.global != 'true')) &&
      (needs.publish-llm-mesh.result == 'success' || (needs.publish-llm-mesh.result == 'skipped' && needs.changes.outputs.llm_mesh_publish != 'true')) &&
      (needs.publish-llm-gateway.result == 'success' || (needs.publish-llm-gateway.result == 'skipped' && needs.changes.outputs.llm_gateway_publish != 'true')) &&
      (needs.publish-events.result == 'success' || (needs.publish-events.result == 'skipped' && needs.changes.outputs.events_publish != 'true')) &&
      (needs.publish-contracts.result == 'success' || (needs.publish-contracts.result == 'skipped' && needs.changes.outputs.contracts_publish != 'true')) &&
      (needs.publish-mcp-platform.result == 'success' || (needs.publish-mcp-platform.result == 'skipped' && needs.changes.outputs.mcp_platform_publish != 'true')) &&
      (needs.publish-artifacts.result == 'success' || (needs.publish-artifacts.result == 'skipped' && needs.changes.outputs.artifacts_publish != 'true'))
    concurrency:
      group: npm-publish-train
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Dry-run package publication
        if: inputs.capacity_publish_dry_run == true
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make ci-capacity-publish-dry-run PACKAGE=cluster-mesh ENV=test-ci-capacity
      - name: Publish Cluster Mesh
        if: inputs.capacity_publish_dry_run != true
        run: make publish-cluster-mesh
      - name: Qualify published Cluster Mesh from the registry
        if: inputs.capacity_publish_dry_run != true
        run: |
          set -eu
          receipt=tmp/ci-manifest-guard/publish/cluster-mesh.publish-output
          if [ ! -f "$receipt" ]; then echo "::error title=Publication qualification::cluster-mesh publish receipt $receipt is missing: publication outcome unknown, qualification cannot be skipped"; exit 1; fi
          status="$(sed -n 's/^status=//p' "$receipt")"
          if [ -z "$status" ]; then echo "::error title=Publication qualification::cluster-mesh publish receipt $receipt has no status= line: publication outcome unknown"; exit 1; fi
          pkg="$(sed -n 's/^pkg=//p' "$receipt")"
          report_dir=tmp/ci-manifest-guard/qualify-cluster-mesh
          conflict="$(sed -n 's/^conflict=//p' "$receipt")"
          provenance_run=
          # Release train (BRDP-EX10, BRCIW-EX3): an equal-integrity conflict (verified bytes on the registry) is
          # qualified at once. A plain skip on a first attempt is a version published before this run (e.g. a
          # README-only change); on a re-run it is healed, and QUALIFY_PROVENANCE_RUN turns a version published by
          # an earlier run (stale skip) into a notice instead of a red provenance check.
          case "$status" in
            published) ;;
            skipped)
              if [ "$conflict" = equal-integrity ]; then echo "::notice title=Publication qualification::cluster-mesh equal-integrity publish conflict: running post-publication qualification"
              else
                if [ "$GITHUB_RUN_ATTEMPT" -le 1 ]; then echo "::notice title=Publication qualification::cluster-mesh status=skipped on the first attempt: ${pkg} was published before this run, nothing to qualify"; exit 0; fi
                name="${pkg%@*}"; version="${pkg##*@}"
                if ! curl -fsS --retry 3 --retry-all-errors -o /dev/null -H 'cache-control: no-cache' "https://registry.npmjs.org/$(printf '%s' "$name" | sed 's#/#%2f#')/${version}?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"; then echo "::error title=Publication qualification::cluster-mesh status=skipped but ${pkg} is absent from the registry"; exit 1; fi
                provenance_run="$GITHUB_RUN_ID"
                echo "::notice title=Publication qualification::cluster-mesh status=skipped on run attempt ${GITHUB_RUN_ATTEMPT}, ${pkg} present on the registry: running post-publication qualification (stale skip if published by another run)"
              fi ;;
            *) echo "::error title=Publication qualification::cluster-mesh status=${status}: unexpected publication outcome"; exit 1 ;;
          esac
          make qualify-published-install PKG="$pkg" PEERS=@sentropic/llm-mesh@0.30.0,@sentropic/llm-gateway@0.21.5,@sentropic/mcp-auth@0.2.1,@sentropic/auth-hono@0.17.0,@sentropic/artifacts@0.2.0,jose@5.10.0,@sentropic/comments@0.3.1 QUALIFY_MODE=post-publication REPORT_DIR="$report_dir" QUALIFY_WAIT_ATTEMPTS=36 QUALIFY_PROVENANCE_SHA="$GITHUB_SHA" QUALIFY_PROVENANCE_RUN="$provenance_run" ENV=test-ci-cluster-mesh
      - name: Upload Cluster Mesh publication qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualify-cluster-mesh-published
          path: tmp/ci-manifest-guard/qualify-cluster-mesh/**
          retention-days: 7
          if-no-files-found: ignore

  # Release train (BRDP-EX10): after llm-mesh/llm-gateway publication, the registry dist.integrity of the
  # bytes actually published must equal the committed cluster-mesh `selected` fixture lock. A separate job,
  # not a publish step: a mismatch turns main red (fixture lock stale) without stopping the publish chain.
  verify-train-lock-integrity:
    runs-on: ubuntu-latest
    needs: [changes, publish-llm-mesh, publish-llm-gateway]
    # `!cancelled()` (not `always()`): a manual cancel stops the chain (deviation from design section 5).
    if: >-
      !cancelled() && inputs.decision_fixtures_only != true && needs.changes.result == 'success' && github.ref == 'refs/heads/main' && (needs.publish-llm-mesh.result == 'success' || needs.publish-llm-gateway.result == 'success')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      # A package whose publish job succeeded in this run must be on the registry (retried); the other is notice-only.
      - name: Check train lock integrity against the registry
        env:
          LLM_MESH_PUBLISH_RESULT: ${{ needs.publish-llm-mesh.result }}
          LLM_GATEWAY_PUBLISH_RESULT: ${{ needs.publish-llm-gateway.result }}
        run: |
          set -eu
          required=""
          if [ "$LLM_MESH_PUBLISH_RESULT" = success ]; then required="@sentropic/llm-mesh"; fi
          if [ "$LLM_GATEWAY_PUBLISH_RESULT" = success ]; then required="${required:+$required }@sentropic/llm-gateway"; fi
          make -f packages/cluster-mesh/packaging.mk check-train-lock-integrity REQUIRE_PUBLISHED="$required" ENV=test-ci-cluster-mesh

  bootstrap-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.decision_fixtures_only != true && inputs.bootstrap_publish_target != 'none' && github.ref == 'refs/heads/main'
    steps:
      # Defense in depth for API-dispatched runs: the choice list is not enforced
      # server-side, so fail unless the target is exactly one declared package.
      - name: Require one explicit bootstrap target
        env:
          BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target }}
        run: |
          set -eu
          case "$BOOTSTRAP_TARGET" in
            contracts|events|chat-core|chat-server|comments|chat-ui|oauth-verify|mcp-auth|mcp-platform|auth-client|auth-ui|flow|cowork-bridge|cowork-desktop|harness|llm-gateway|cluster-mesh|cited-source-viewer|artifacts) ;;
            *) echo "::error title=Bootstrap publish::target '${BOOTSTRAP_TARGET}' is not one explicit declared package (no 'all' bootstrap)"; exit 1 ;;
          esac
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Write NPM_TOKEN to file
        run: |
          mkdir -p /tmp/sentropic-secrets
          printf '%s' "$NPM_TOKEN" > /tmp/sentropic-secrets/npm-token
          chmod 600 /tmp/sentropic-secrets/npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Bootstrap publish contracts
        if: inputs.bootstrap_publish_target == 'contracts'
        run: make publish-contracts-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish events
        if: inputs.bootstrap_publish_target == 'events'
        run: make publish-events-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish chat-core
        if: inputs.bootstrap_publish_target == 'chat-core'
        run: make publish-chat-core-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish chat-server
        if: inputs.bootstrap_publish_target == 'chat-server'
        run: make publish-chat-server-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish comments
        if: inputs.bootstrap_publish_target == 'comments'
        run: make publish-comments-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish chat-ui
        if: inputs.bootstrap_publish_target == 'chat-ui'
        run: make publish-chat-ui-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish cited-source-viewer
        if: inputs.bootstrap_publish_target == 'cited-source-viewer'
        run: make publish-cited-source-viewer-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish oauth-verify
        if: inputs.bootstrap_publish_target == 'oauth-verify'
        run: make publish-oauth-verify-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish mcp-auth
        if: inputs.bootstrap_publish_target == 'mcp-auth'
        run: make publish-mcp-auth-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Qualify bootstrap-published mcp-auth
        if: inputs.bootstrap_publish_target == 'mcp-auth'
        run: |
          set -eu
          receipt=tmp/ci-manifest-guard/publish/mcp-auth.publish-output
          if [ ! -f "$receipt" ]; then echo "::error title=Publication qualification::mcp-auth publish receipt $receipt is missing: publication outcome unknown, qualification cannot be skipped"; exit 1; fi
          status="$(sed -n 's/^status=//p' "$receipt")"
          if [ -z "$status" ]; then echo "::error title=Publication qualification::mcp-auth publish receipt $receipt has no status= line: publication outcome unknown"; exit 1; fi
          if [ "$status" != published ]; then echo "::notice title=Publication qualification::mcp-auth status=${status}: qualification runs only after a new publication"; exit 0; fi
          pkg="$(sed -n 's/^pkg=//p' "$receipt")"
          make qualify-published-install PKG="$pkg" PEERS=hono@4.10.7 QUALIFY_MODE=post-publication REPORT_DIR=tmp/ci-manifest-guard/qualify-mcp-auth ENV=test-ci-mcp-auth
      - name: Bootstrap publish mcp-platform
        if: inputs.bootstrap_publish_target == 'mcp-platform'
        run: make publish-mcp-platform-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish auth-client
        if: inputs.bootstrap_publish_target == 'auth-client'
        run: make publish-auth-client-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish auth-ui
        if: inputs.bootstrap_publish_target == 'auth-ui'
        run: make publish-auth-ui-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish flow
        if: inputs.bootstrap_publish_target == 'flow'
        run: make publish-flow-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish cowork-bridge
        if: inputs.bootstrap_publish_target == 'cowork-bridge'
        run: make publish-cowork-bridge-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish cowork-desktop
        if: inputs.bootstrap_publish_target == 'cowork-desktop'
        run: make publish-cowork-desktop-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish harness
        if: inputs.bootstrap_publish_target == 'harness'
        run: make publish-harness-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish llm-gateway
        if: inputs.bootstrap_publish_target == 'llm-gateway'
        run: make publish-llm-gateway-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish cluster-mesh
        if: inputs.bootstrap_publish_target == 'cluster-mesh'
        run: make publish-cluster-mesh-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish artifacts
        if: inputs.bootstrap_publish_target == 'artifacts'
        run: make publish-artifacts-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Qualify bootstrap-published cluster-mesh
        if: inputs.bootstrap_publish_target == 'cluster-mesh'
        run: |
          set -eu
          receipt=tmp/ci-manifest-guard/publish/cluster-mesh.publish-output
          if [ ! -f "$receipt" ]; then echo "::error title=Publication qualification::cluster-mesh publish receipt $receipt is missing: publication outcome unknown, qualification cannot be skipped"; exit 1; fi
          status="$(sed -n 's/^status=//p' "$receipt")"
          if [ -z "$status" ]; then echo "::error title=Publication qualification::cluster-mesh publish receipt $receipt has no status= line: publication outcome unknown"; exit 1; fi
          if [ "$status" != published ]; then echo "::notice title=Publication qualification::cluster-mesh status=${status}: qualification runs only after a new publication"; exit 0; fi
          pkg="$(sed -n 's/^pkg=//p' "$receipt")"
          make qualify-published-install PKG="$pkg" PEERS=@sentropic/llm-mesh@0.30.0,@sentropic/llm-gateway@0.21.5,@sentropic/mcp-auth@0.2.1,@sentropic/auth-hono@0.17.0,@sentropic/artifacts@0.2.0,jose@5.10.0,@sentropic/comments@0.3.1 QUALIFY_MODE=post-publication REPORT_DIR=tmp/ci-manifest-guard/qualify-cluster-mesh ENV=test-ci-cluster-mesh
      - name: Upload bootstrap publication receipts and qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-publication-qualification
          path: |
            tmp/ci-manifest-guard/publish/**
            tmp/ci-manifest-guard/qualify-*/**
          retention-days: 7
          if-no-files-found: ignore

  # BR-55c (ARCH-17): main -> PREPROD continuous deploy. REPLACES the legacy
  # prod-targeting deploy-k8s job — NO main merge can touch the `sentropic` (prod)
  # namespace any more. Prod deploys ONLY via the gated release-prod (BR-55d:
  # GitHub production Environment + rhanka reviewer). This job uses the
  # preprod-scoped KUBE_CONFIG_DATA_PREPROD (poc-k8s; a namespace-scoped kubeconfig
  # that can ONLY write the sentropic-preprod ns — the prod ns is RBAC-denied), and
  # `make k8s-deploy-preprod` pins the immutable content-hash image tags into
  # overlays/preprod before applying (kills the floating :main staleness, D-c1).
  deploy-preprod:
    runs-on: ubuntu-latest
    needs: [publish-api-image, publish-ui-image]
    # Deploy on every main merge. Run even when the publish jobs were SKIPPED (no
    # api/ui content change) so an overlay/manifest-only change still reaches preprod;
    # only skip if a publish job actually FAILED.
    if: >-
      always() && github.ref == 'refs/heads/main' && !cancelled()
      && inputs.decision_fixtures_only != true
      && needs.publish-api-image.result != 'failure'
      && needs.publish-ui-image.result != 'failure'
    steps:
      - uses: actions/checkout@v6
      - name: Decode the preprod kubeconfig from secret
        env:
          KUBE_CONFIG_DATA_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: |
          set -eu
          if [ -z "${KUBE_CONFIG_DATA_PREPROD:-}" ]; then
            echo "::error::GH secret KUBE_CONFIG_DATA_PREPROD is missing or empty (poc-k8s preprod kubeconfig)."
            exit 1
          fi
          printf '%s' "${KUBE_CONFIG_DATA_PREPROD}" | base64 -d > kubeconfig-preprod.yaml
          chmod 600 kubeconfig-preprod.yaml
      - name: Assert both images exist at the registry before deploy (fail loud, never ImagePullBackOff)
        env:
          DOCKER_USERNAME: nologin
          DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          set -eu
          # k8s-deploy-preprod (next step) pins the immutable content-hash tags
          # sentropic-api:$(API_VERSION) + sentropic-ui:$(UI_VERSION) into overlays/preprod.
          # If either tag was never pushed (publish skipped/failed, or a tag mismatch), a
          # kubectl apply would leave preprod in ImagePullBackOff and the cluster is the
          # first to notice. This is a control that PREVENTS: assert both manifests exist
          # in the registry first (docker manifest inspect via check-{api,ui}-image) and
          # fail this job with a clear error, rather than deploying an unverified reference.
          make check-api-image check-ui-image
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Deploy to the sentropic-preprod namespace (immutable image pin)
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig-preprod.yaml
        run: |
          set -eu
          node --input-type=module -e "import { checkPreprodIdp } from './deploy/ci/idp-identity-sync/session-preflight.mjs'; checkPreprodIdp();"
          make k8s-deploy-preprod KUBECONFIG="${KUBECONFIG}" ENV=ci-preprod

  # Aggregate every PR validation job so path-filtered skips satisfy one required check.
  # Cleanup waits for image publication/deployment through capacity receipts.
  # Package publishers/bootstrap and verify-train-lock-integrity do not use them.
  ci-gate:
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: read
    needs:
      - decision-offline
      - enforce-package-bump
      - qualify-engram-e2
      - changes
      - validate-publishable-manifests
      - build-e2e
      - typecheck-lint-ui
      - typecheck-lint-api
      - validate-idp-sync
      - validate-llm-mesh
      - validate-cluster-mesh
      - validate-llm-gateway
      - validate-chat-ui
      - validate-cited-source-viewer
      - validate-cowork-bridge
      - validate-oauth-verify
      - validate-mcp-auth
      - validate-mcp-platform
      - memory-l5-qualification
      - validate-auth-hono
      - validate-auth-client
      - validate-auth-ui
      - validate-cowork-desktop
      - validate-contracts
      - validate-events
      - validate-chat-core
      - validate-chat-server
      - validate-comments
      - validate-skills
      - validate-flow
      - validate-artifacts
      - validate-harness
      - validate-live-speech
      - build-api-image
      - build-api-tool-image
      - test-api-unit-integration
      - build-ui
      - build-desktop
      - test-ui
      - build-ui-static
      - test-e2e
      - e2e-vscode
      - smoke-idp-screens
      - security-sast-sca
      - security-code-api
      - security-code-ui
      - security-iac
      - security-container
      - security-container-e2e
      - security-container-ui
      - security-container-api-tool
      - security-container-api
      - test-smoke-restore
      - ci-capacity-receipts
      - delete-transport-artifacts
      - validate-ci-capacity-metrics
    steps:
      - name: Reject fixture-only merge evidence
        if: inputs.decision_fixtures_only == true
        shell: bash
        run: |
          echo "::error::Fixture-only run is not merge evidence"
          exit 1
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ci-expected-${{ github.run_id }}-${{ needs.changes.outputs.expected_attempt }}
          path: tmp/ci-capacity
      - name: Capture the current attempt for the final verdict
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const params = { ...context.repo, run_id: context.runId,
              attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT) };
            const { data: run } = await github.rest.actions.getWorkflowRunAttempt(params);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              { ...params, per_page: 100 });
            fs.writeFileSync('tmp/ci-capacity/capture.json', JSON.stringify({ run, jobs,
              sourceSha: run.head_sha, workflowSha: process.env.GITHUB_WORKFLOW_SHA ?? null }, null, 2));
      - name: Check required CI results
        shell: bash
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
        run: make ci-expected-results EXPECTED_FILE=tmp/ci-capacity/expected.json EXECUTED_FILE=tmp/ci-capacity/capture.json ENV=test-ci-62

  # Only this job can delete artifacts; every consumer precedes capacity receipts.
  delete-transport-artifacts:
    runs-on: ubuntu-latest
    needs: [ci-capacity-receipts]
    if: always() && !cancelled() && inputs.decision_fixtures_only != true
    permissions:
      actions: write
    steps:
      - name: Delete consumed transport artifacts
        # Fork tokens are read-only; cancellation also has the one-day expiry fallback.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const names = new Set(['api-tool-image', 'api-image', 'ui-image', 'e2e-image', 'desktop-download']);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.runId, per_page: 100 });
            for (const artifact of artifacts.filter(item => names.has(item.name))) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
              core.info(`Deleted ${artifact.name} (${artifact.id}, ${artifact.size_in_bytes} bytes)`);
            }

  # BR76-EX1 — retain actual matrix/job/step receipts before the final gate.
  # The manifest validator remains an independent leaf; the gate supplies its
  # completed result through needs. Rollback preserves expected-result checks.
  ci-capacity-receipts:
    runs-on: ubuntu-latest
    if: always() && inputs.decision_fixtures_only != true
    permissions:
      contents: read
      actions: read
    needs: [changes, enforce-package-bump, build-e2e, typecheck-lint-ui, typecheck-lint-api,
      validate-idp-sync, validate-llm-mesh, validate-cluster-mesh, validate-llm-gateway,
      validate-chat-ui, validate-cited-source-viewer, validate-cowork-bridge, validate-oauth-verify,
      validate-mcp-auth, validate-mcp-platform, validate-auth-hono, validate-auth-client,
      validate-auth-ui, validate-cowork-desktop, validate-contracts, validate-events,
      validate-chat-core, validate-chat-server, validate-comments, validate-live-speech, validate-skills, validate-flow,
      validate-artifacts, validate-harness, build-api-image, build-api-tool-image,
      test-api-unit-integration, build-ui, build-desktop, test-ui, build-ui-static, test-e2e, e2e-vscode, smoke-idp-screens,
      security-sast-sca, security-code-api, security-code-ui, security-iac, security-container, security-container-e2e, security-container-ui, security-container-api-tool, security-container-api, test-smoke-restore, validate-ci-capacity-metrics,
      publish-api-image, publish-ui-image, deploy-preprod, publish-cluster-mesh,
      publish-llm-mesh, publish-llm-gateway, publish-chat-ui, publish-cited-source-viewer,
      publish-cowork-bridge, publish-oauth-verify, publish-mcp-auth, publish-mcp-platform,
      publish-artifacts, publish-auth-hono, publish-auth-client, publish-auth-ui,
      publish-cowork-desktop, publish-contracts, publish-events, publish-chat-core,
      publish-chat-server, publish-comments, publish-flow, publish-harness,
      bootstrap-publish]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ci-expected-${{ github.run_id }}-${{ needs.changes.outputs.expected_attempt }}
          path: tmp/ci-capacity
      - name: Capture identified run and expanded job receipts
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const params = { ...context.repo, run_id: context.runId };
            const { data: run } = await github.rest.actions.getWorkflowRunAttempt(
              { ...params, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT) });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              { ...params, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT), per_page: 100 });
            const manifest = JSON.parse(fs.readFileSync('tmp/ci-capacity/expected.json'));
            const expected = manifest.expected;
            const packages = expected.filter(row => row.job.startsWith('publish-') && !row.job.endsWith('-image'));
            const selected = packages.filter(row => row.selected);
            const endpoints = { qualification: ['ci-gate'], images: ['publish-api-image', 'publish-ui-image'],
              preproduction: ['deploy-preprod'], packages: (selected.length ? selected : packages).map(row => row.job) };
            const capacity = { availableSlots: 17, reserveSlots: context.eventName === 'pull_request' ? 2 : 0 };
            fs.writeFileSync('tmp/ci-capacity/capture.json', JSON.stringify({ run, jobs, endpoints, capacity,
              dependencies: manifest.dependencies,
              sourceSha: run.head_sha, workflowSha: process.env.GITHUB_WORKFLOW_SHA ?? null }, null, 2));
      - name: Emit measured job and step spans through Make
        run: make --no-print-directory ci-run-metrics RUN_FILE=tmp/ci-capacity/capture.json ENV=test-ci-62 > tmp/ci-capacity/metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/ci-capacity/capture.json
            tmp/ci-capacity/metrics.json
          if-no-files-found: error
          retention-days: 7

  # BR76-EX1 — qualify the capacity receipts behind Make entry points: the
  # fixture suites plus selection-aware negative cases run in required CI.
  # Always scheduled, credential-free, and aggregated by ci-gate.
  # Rollback: delete this job and its ci-gate entry.
  validate-ci-capacity-metrics:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && !cancelled() && inputs.decision_fixtures_only != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Qualify CI capacity metrics and expected-result fixtures
        run: make ci-capacity-policy test-ci-run-metrics test-ci-expected-results ENV=test-ci-capacity
      - name: Qualify artifact dispatch and fail-closed scan joins
        run: make test-ci-dag test-security-parser ENV=test-ci-capacity
      - name: Prove selection-aware negative cases through the Make entry point
        run: |
          set -euo pipefail
          # Fixtures live under the workspace: the Make entry points run in a
          # container that mounts only the worktree, so a host mktemp path
          # would be unreadable inside Docker.
          tmp="tmp/ci-capacity-selfcheck"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/expected.json" <<'EOF'
          {"expected": [
            {"job": "selected-success", "required": true, "selected": true},
            {"job": "selected-skipped", "required": true, "selected": true},
            {"job": "selected-missing", "required": true, "selected": true},
            {"job": "unselected-skipped", "required": true, "selected": false},
            {"job": "matrix-base", "matrix": ["m-a", "m-b"], "required": true, "selected": true}
          ]}
          EOF
          cat > "$tmp/executed.json" <<'EOF'
          {"executed": [
            {"job": "selected-success", "conclusion": "success"},
            {"job": "selected-skipped", "conclusion": "skipped"},
            {"job": "unselected-skipped", "conclusion": "skipped"},
            {"job": "matrix-base (m-a)", "conclusion": "success"}
          ]}
          EOF
          if make ci-expected-results EXPECTED_FILE="$tmp/expected.json" EXECUTED_FILE="$tmp/executed.json" ENV=test-ci-62; then
            echo '::error title=Expected-result wiring::evaluator accepted a selected skipped member, a missing member, or a missing matrix member'
            exit 1
          fi
          echo 'negative cases rejected: selected skipped, missing, and missing matrix members'
          cat > "$tmp/clean-expected.json" <<'EOF'
          {"expected": [
            {"job": "selected-success", "required": true, "selected": true},
            {"job": "unselected-skipped", "required": true, "selected": false},
            {"job": "matrix-base", "matrix": ["m-a", "m-b"], "required": true, "selected": true}
          ]}
          EOF
          cat > "$tmp/clean-executed.json" <<'EOF'
          {"executed": [
            {"job": "selected-success", "conclusion": "success"},
            {"job": "unselected-skipped", "conclusion": "skipped"},
            {"job": "matrix-base (m-a)", "conclusion": "success"},
            {"job": "matrix-base (m-b)", "conclusion": "success"}
          ]}
          EOF
          make ci-expected-results EXPECTED_FILE="$tmp/clean-expected.json" EXECUTED_FILE="$tmp/clean-executed.json" ENV=test-ci-62
          echo 'positive cases accepted: executed selected members pass, unselected skipped never blocks'
