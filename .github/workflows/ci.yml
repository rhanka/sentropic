name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_publish_target:
        description: 'Bootstrap-publish target (uses NPM_TOKEN; first publish only before OIDC trusted publishers are attached)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - contracts
          - events
          - chat-core
          - chat-server
          - comments
          - chat-ui
          - oauth-verify
          - mcp-auth
          - mcp-platform
          - auth-hono
          - auth-client
          - auth-ui
          - flow
          - cowork-bridge
          - cowork-desktop
          - build-cli
          - cli
          - harness
          - llm-gateway
          - focus
          - cited-source-viewer
          - all

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

jobs:
  enforce-package-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version bump for packages with src changes
        run: |
          set -eu
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE" --depth=200 >/dev/null 2>&1
          MERGE_BASE="$(git merge-base "origin/$BASE" HEAD)"
          CHANGED="$(git diff --name-only "$MERGE_BASE" HEAD)"
          FAIL=""
          for pkg_dir in packages/*/; do
            [ -d "$pkg_dir" ] || continue
            pkg="$(basename "$pkg_dir")"
            # Skip if no src/ changes for this package in the PR diff
            if ! printf '%s\n' "$CHANGED" | grep -qE "^packages/${pkg}/src/"; then
              continue
            fi
            # Skip private packages (not published)
            is_private="$(node -p "JSON.parse(require('fs').readFileSync('packages/${pkg}/package.json','utf8')).private===true" 2>/dev/null || echo false)"
            if [ "$is_private" = "true" ]; then
              echo "::notice::packages/${pkg} is private — skipping bump check"
              continue
            fi
            OLD="$(git show "$MERGE_BASE:packages/${pkg}/package.json" 2>/dev/null | grep -m1 '"version"' | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/' || true)"
            NEW="$(grep -m1 '"version"' "packages/${pkg}/package.json" | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/')"
            # If OLD missing, package is new — bootstrap path covers it; skip
            if [ -z "$OLD" ]; then
              echo "::notice::packages/${pkg} appears new (no base version) — skipping bump check"
              continue
            fi
            if [ "$OLD" = "$NEW" ]; then
              echo "::error::packages/${pkg} has changes under src/ but version is unchanged ($OLD). Bump packages/${pkg}/package.json version (semver) before merging. See rules/workflow.md → Package publication."
              FAIL="$FAIL ${pkg}($OLD)"
            else
              echo "::notice::packages/${pkg}: $OLD -> $NEW ✓"
            fi
          done
          if [ -n "$FAIL" ]; then
            echo "::error::Missing version bumps:$FAIL"
            exit 1
          fi
          echo "All touched packages have bumped versions."

  changes:
    runs-on: ubuntu-latest
    outputs:
      global: ${{ steps.filter.outputs.global }}
      api: ${{ steps.filter.outputs.api }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      workers: ${{ steps.filter.outputs.workers }}
      ui: ${{ steps.filter.outputs.ui }}
      ai: ${{ steps.filter.outputs.ai }}
      llm_mesh: ${{ steps.filter.outputs.llm_mesh }}
      llm_gateway: ${{ steps.filter.outputs.llm_gateway }}
      chat_ui: ${{ steps.filter.outputs.chat_ui }}
      cited_source_viewer: ${{ steps.filter.outputs.cited_source_viewer }}
      cowork_bridge: ${{ steps.filter.outputs.cowork_bridge }}
      cowork_bridge_publish: ${{ steps.filter.outputs.cowork_bridge_publish }}
      cowork_desktop: ${{ steps.filter.outputs.cowork_desktop }}
      cowork_desktop_publish: ${{ steps.filter.outputs.cowork_desktop_publish }}
      oauth_verify: ${{ steps.filter.outputs.oauth_verify }}
      mcp_auth: ${{ steps.filter.outputs.mcp_auth }}
      mcp_platform: ${{ steps.filter.outputs.mcp_platform }}
      auth_hono: ${{ steps.filter.outputs.auth_hono }}
      auth_client: ${{ steps.filter.outputs.auth_client }}
      auth_ui: ${{ steps.filter.outputs.auth_ui }}
      chat_core: ${{ steps.filter.outputs.chat_core }}
      chat_server: ${{ steps.filter.outputs.chat_server }}
      comments: ${{ steps.filter.outputs.comments }}
      events: ${{ steps.filter.outputs.events }}
      contracts: ${{ steps.filter.outputs.contracts }}
      flow: ${{ steps.filter.outputs.flow }}
      llm_mesh_publish: ${{ steps.filter.outputs.llm_mesh_publish }}
      llm_gateway_publish: ${{ steps.filter.outputs.llm_gateway_publish }}
      chat_ui_publish: ${{ steps.filter.outputs.chat_ui_publish }}
      cited_source_viewer_publish: ${{ steps.filter.outputs.cited_source_viewer_publish }}
      oauth_verify_publish: ${{ steps.filter.outputs.oauth_verify_publish }}
      mcp_auth_publish: ${{ steps.filter.outputs.mcp_auth_publish }}
      mcp_platform_publish: ${{ steps.filter.outputs.mcp_platform_publish }}
      auth_hono_publish: ${{ steps.filter.outputs.auth_hono_publish }}
      auth_client_publish: ${{ steps.filter.outputs.auth_client_publish }}
      auth_ui_publish: ${{ steps.filter.outputs.auth_ui_publish }}
      chat_core_publish: ${{ steps.filter.outputs.chat_core_publish }}
      chat_server_publish: ${{ steps.filter.outputs.chat_server_publish }}
      comments_publish: ${{ steps.filter.outputs.comments_publish }}
      events_publish: ${{ steps.filter.outputs.events_publish }}
      contracts_publish: ${{ steps.filter.outputs.contracts_publish }}
      flow_publish: ${{ steps.filter.outputs.flow_publish }}
      build_cli: ${{ steps.filter.outputs.build_cli }}
      build_cli_publish: ${{ steps.filter.outputs.build_cli_publish }}
      harness: ${{ steps.filter.outputs.harness }}
      harness_publish: ${{ steps.filter.outputs.harness_publish }}
      focus: ${{ steps.filter.outputs.focus }}
      focus_publish: ${{ steps.filter.outputs.focus_publish }}
      cli: ${{ steps.filter.outputs.cli }}
      cli_publish: ${{ steps.filter.outputs.cli_publish }}
    steps:
      - uses: actions/checkout@v6
      # Enforces the "Keep `api` and `ui` in sync with API_VERSION / UI_VERSION"
      # note below. That invariant was a comment, so nothing caught a drift: a
      # path feeding the content-sha but missing from the filter skips publish
      # while moving the deployed tag. Runs in `changes` (always executed, already
      # checked out) so it costs no extra runner.
      - name: Assert change-filters cover the image content-hash inputs
        run: make check-ci-version-filters
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            global:
              - 'Makefile'
              - 'docker-compose.yml'
              - 'docker-compose.test.yml'
              - '.github/workflows/ci.yml'
              - 'e2e/**'
            # Keep `api` and `ui` in sync with the API_VERSION / UI_VERSION content-sha inputs
            # in the Makefile. Those shas are the immutable image tags that publish-{api,ui}-image
            # push and that deploy-preprod pins. A path that feeds the sha but is missing here
            # bumps the pinned tag without ever building it -> ImagePullBackOff on preprod.
            api:
              - 'api/**'
              - 'apps/auth-idp/**'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-mesh/**'
              - 'packages/flow/**'
              - 'packages/chat-server/**'
              - 'packages/chat-core/**'
              - 'packages/events/**'
              - 'packages/contracts/**'
              - 'packages/comments/**'
            ui:
              - 'ui/**'
              - 'packages/chat-ui/**'
              - 'packages/cowork-desktop/**'
              - 'packages/cowork-bridge/**'
            llm_mesh:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-mesh/**'
              - '.github/workflows/ci.yml'
            llm_gateway:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-gateway/**'
              - 'packages/llm-mesh/**'
              - '.github/workflows/ci.yml'
            llm_mesh_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-mesh/**'
            llm_gateway_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-gateway/**'
            chat_ui:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-ui/**'
              - '.github/workflows/ci.yml'
            chat_ui_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-ui/**'
            cited_source_viewer:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cited-source-viewer/**'
              - '.github/workflows/ci.yml'
            cited_source_viewer_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cited-source-viewer/**'
            cowork_bridge:
