        run: make publish-cowork-bridge-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish cowork-desktop
        if: inputs.bootstrap_publish_target == 'cowork-desktop' || inputs.bootstrap_publish_target == 'all'
        run: make publish-cowork-desktop-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token

  # Deploy Kubernetes tenant after api+ui images are published with the main alias.
  # Triggered on main. Requires GH secret KUBECONFIG_B64
  # (base64 of ~/.kube/poc.yaml). See deploy/k8s/README.md and BRANCH.md Lot 2.5.
  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [publish-api-image, publish-ui-image]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - name: Decode kubeconfig from secret
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -eu
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::GH secret KUBECONFIG_B64 is missing or empty. See BRANCH.md Lot 2.5 user action item."
            exit 1
          fi
          printf '%s' "${KUBECONFIG_B64}" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml
      - name: Apply manifests and verify api + ui on Kubernetes
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig.yaml
        run: |
          set -eu
          make k8s-deploy KUBECONFIG="${KUBECONFIG}" ENV=ci-k8s
          kubectl -n sentropic rollout status  deployment/api --timeout=300s
          kubectl -n sentropic rollout status  deployment/ui  --timeout=300s
