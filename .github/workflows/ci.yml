            auth_ui:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-ui/**'
              - '.github/workflows/ci.yml'
            auth_ui_publish:
              - 'packages/auth-ui/**'
            chat_core:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-core/**'
              - 'packages/chat-ui/**'
              - 'packages/events/**'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            chat_core_publish:
              - 'packages/chat-core/**'
            chat_server:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-server/**'
              - '.github/workflows/ci.yml'
            chat_server_publish:
              - 'packages/chat-server/**'
            comments:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/comments/**'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            comments_publish:
              - 'packages/comments/**'
            skills:
              - 'packages/skills/**'
            events:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/events/**'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            events_publish:
              - 'packages/events/**'
            contracts:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            contracts_publish:
              - 'packages/contracts/**'
            flow:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/flow/**'
              - '.github/workflows/ci.yml'
            flow_publish:
              - 'packages/flow/**'
            artifacts:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/artifacts/**'
              - 'docs/governance/kit/**'
              - 'packages/components-svelte/**'
              - 'packages/design-system-themes/**'
              - '.github/workflows/ci.yml'
            artifacts_publish:
              - 'packages/artifacts/**'
            harness:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/harness/**'
              - '.github/workflows/ci.yml'
            live_speech:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/live-speech/**'
            harness_publish:
              - 'packages/harness/**'
            # Dedicated guard filter: never part of global, api/ui/e2e or _publish fanout.
            manifest_guard:
              - 'scripts/ci/**'
      # Separate step so only this single filter emits a file list (job-output size limit).
      - uses: dorny/paths-filter@v4
        id: publishable_files
        with:
          list-files: json
          filters: |
            publishable_package_files:
              - 'packages/*/**'
      - name: Select E2 topic and final integration qualification (BR-E2-EX1)
        id: engram_e2_scope
        env:
          SELECTED: ${{ (github.base_ref == 'feat/engram-e2-integration' || (github.base_ref == 'main' && github.head_ref == 'feat/engram-e2-integration')) && steps.filter.outputs.engram_e2 == 'true' }}
        run: echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
      - name: Retain expected execution set before dispatch (BR76-EX1)
        id: ci_expected
        env:
          ENGRAM_E2_SELECTED: ${{ steps.engram_e2_scope.outputs.selected }}
          CI_SELECTION_CONTEXT: >-
            {"changes": ${{ toJSON(steps.filter.outputs) }}, "event": "${{ github.event_name }}",
            "ref": "${{ github.ref }}", "inputs": {"bootstrap_publish_target": "${{ inputs.bootstrap_publish_target || 'none' }}", "capacity_publish_dry_run": ${{ inputs.capacity_publish_dry_run || false }}},
            "identity": {"runId": "${{ github.run_id }}", "attempt": "${{ github.run_attempt }}",
            "headSha": "${{ github.event.pull_request.head.sha || github.sha }}"}}
        run: |
          export CI_SELECTION_CONTEXT="$(node -e 'const context = JSON.parse(process.env.CI_SELECTION_CONTEXT); context.changes.engram_e2 = process.env.ENGRAM_E2_SELECTED; if (context.inputs.capacity_publish_dry_run) for (const key of Object.keys(context.changes)) if (key.endsWith("_publish")) context.changes[key] = "true"; process.stdout.write(JSON.stringify(context));')"
          make ci-expected-manifest ENV=test-ci-62
      - uses: actions/upload-artifact@v4
        with:
          name: ci-expected-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-capacity/expected.json
          if-no-files-found: error
          retention-days: 7
      # BR76-EX1 — classification receipt: anchor the <=15s budget against the
      # job timestamps (this echo measures nothing; compare with started_at).
      - name: Record classification receipt (BR76-EX1)
        run: |
          {
            echo "### Classification receipt (BR-76)";
            echo "- run: ${{ github.run_id }}, attempt: ${{ github.run_attempt }}, event: ${{ github.event_name }}, ref: ${{ github.ref }}";
            echo "- workflow SHA: ${{ github.sha }}";
            echo "- classification budget to measure: <= 15s (compare with job timestamps, not this echo)";
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishable manifest inventory (spec sections 6 and 9). Always scheduled so a failed or
  # skipped `changes` cannot silently skip this required check; never a publisher dependency.
  validate-publishable-manifests:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && !cancelled() && inputs.decision_fixtures_only != true
    permissions:
      contents: read
    env:
      CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
      CI_MANIFEST_CHANGES_RESULT: ${{ needs.changes.result }}
      CI_MANIFEST_EVENT: ${{ github.event_name }}
      CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
      CI_MANIFEST_BEFORE_SHA: ${{ github.event.before }}
      CI_MANIFEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Check eradicated packages (CLI and focus are owned by h2a)
        run: make check-eradicated-packages ENV=test-ci-manifests
      - name: Test publishable manifest guard and consumer qualification
        run: make test-publishable-manifests test-qualify-published-install ENV=test-ci-manifests
      - name: Check publishable manifests
        run: make check-publishable-manifests ENV=test-ci-manifests
      - name: Upload publishable manifest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishable-manifests
          path: tmp/ci-manifest-guard/manifests/**
          retention-days: 7
          if-no-files-found: ignore

  # Build E2E Docker image
  build-e2e:
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Build and save exact E2E candidate
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make ci-build-e2e save-e2e ENV=test-ci-images
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        with:
          name: e2e-image
          retention-days: 1
          path: |
            e2e-image.tar.zst
            e2e-image.json
          compression-level: 0

  typecheck-lint-ui:
    runs-on: ubuntu-latest
