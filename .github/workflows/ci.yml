  # N1: mcp-auth depends on @sentropic/oauth-verify; publish (and qualify from the registry)
  # only after the sibling publisher succeeded or was skipped, as gateway waits for mesh.
  publish-mcp-auth:
    runs-on: ubuntu-latest
    needs: [changes, validate-mcp-auth, publish-oauth-verify]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.mcp_auth_publish == 'true' &&
      needs.validate-mcp-auth.result == 'success' &&
      (needs.publish-oauth-verify.result == 'success' || needs.publish-oauth-verify.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || inputs.capacity_publish_dry_run == true)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Dry-run package publication
        if: inputs.capacity_publish_dry_run == true
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make ci-capacity-publish-dry-run PACKAGE=mcp-auth ENV=test-ci-capacity
      - name: Publish MCP Auth
        if: inputs.capacity_publish_dry_run != true
        run: make publish-mcp-auth
      - name: Qualify published MCP Auth from the registry
        if: inputs.capacity_publish_dry_run != true
        run: |
          set -eu
          receipt=tmp/ci-manifest-guard/publish/mcp-auth.publish-output
          if [ ! -f "$receipt" ]; then echo "::error title=Publication qualification::mcp-auth publish receipt $receipt is missing: publication outcome unknown, qualification cannot be skipped"; exit 1; fi
          status="$(sed -n 's/^status=//p' "$receipt")"
          if [ -z "$status" ]; then echo "::error title=Publication qualification::mcp-auth publish receipt $receipt has no status= line: publication outcome unknown"; exit 1; fi
          pkg="$(sed -n 's/^pkg=//p' "$receipt")"
          conflict="$(sed -n 's/^conflict=//p' "$receipt")"
          provenance_run=
          # Aligned with cluster-mesh (BRCIW-EX3): an equal-integrity conflict (verified bytes on the registry) is
          # qualified at once; a plain skip is healed only on a re-run, and QUALIFY_PROVENANCE_RUN turns a version
          # published by an earlier run (stale skip, e.g. a no-bump change) into a notice instead of a red check.
          case "$status" in
            published) ;;
            skipped)
              if [ "$conflict" = equal-integrity ]; then echo "::notice title=Publication qualification::mcp-auth equal-integrity publish conflict: running post-publication qualification"
              else
                if [ "$GITHUB_RUN_ATTEMPT" -le 1 ]; then echo "::notice title=Publication qualification::mcp-auth status=skipped on the first attempt: ${pkg} was published before this run, nothing to qualify"; exit 0; fi
                name="${pkg%@*}"; version="${pkg##*@}"
                if ! curl -fsS --retry 3 --retry-all-errors -o /dev/null -H 'cache-control: no-cache' "https://registry.npmjs.org/$(printf '%s' "$name" | sed 's#/#%2f#')/${version}?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"; then echo "::error title=Publication qualification::mcp-auth status=skipped but ${pkg} is absent from the registry"; exit 1; fi
                provenance_run="$GITHUB_RUN_ID"
                echo "::notice title=Publication qualification::mcp-auth status=skipped on run attempt ${GITHUB_RUN_ATTEMPT}, ${pkg} present on the registry: running post-publication qualification (stale skip if published by another run)"
              fi ;;
            *) echo "::error title=Publication qualification::mcp-auth status=${status}: unexpected publication outcome"; exit 1 ;;
          esac
          make qualify-published-install PKG="$pkg" PEERS=hono@4.10.7 QUALIFY_MODE=post-publication REPORT_DIR=tmp/ci-manifest-guard/qualify-mcp-auth QUALIFY_PROVENANCE_SHA="$GITHUB_SHA" QUALIFY_PROVENANCE_RUN="$provenance_run" ENV=test-ci-mcp-auth
      - name: Upload MCP Auth publication qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualify-mcp-auth-published
          path: tmp/ci-manifest-guard/qualify-mcp-auth/**
          retention-days: 7
          if-no-files-found: ignore

