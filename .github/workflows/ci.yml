  test-smoke-restore:
    runs-on: ubuntu-latest
    needs: [changes, build-api-image, build-ui, build-e2e, security-sast-sca]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Backup production database (k8s in-cluster postgres)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -eu
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::GH secret KUBECONFIG_B64 is missing or empty."
            exit 1
          fi
          printf '%s' "${KUBECONFIG_B64}" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml
          make db-backup-prod KUBECONFIG="$PWD/kubeconfig.yaml"
      - name: Test restore and smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: make db-restore up-api-test test-api-smoke-restore BACKUP_FILE=$(ls -t data/backup/prod-*.dump | head -1 | xargs basename) SKIP_CONFIRM=true

  publish-ui-image:
    runs-on: ubuntu-latest
    needs: [changes, test-e2e, e2e-vscode, security-container]
    if: (needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true') && github.ref == 'refs/heads/main'
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
      UI_IMAGE_NAME: sentropic-ui
    steps:
      - uses: actions/checkout@v6
      - name: Check if UI image is up to date
        id: image-check
        run: make check-ui-image
        continue-on-error: true
      - name: Download UI image artifact
        if: steps.image-check.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: ui-image
          path: .
      - name: Load UI image from artifact
        if: steps.image-check.outcome == 'failure'
        run: make load-ui
      - name: Retag UI image for Sentropic publish
        if: steps.image-check.outcome == 'failure'
        env:
          SOURCE_UI_IMAGE_NAME: top-ai-ideas-ui
        run: |
          set -eu
          UI_VERSION="$(make -s version | awk '/^UI_VERSION:/ {print $2}')"
          docker tag "${REGISTRY}/${SOURCE_UI_IMAGE_NAME}:${UI_VERSION}" "${REGISTRY}/${UI_IMAGE_NAME}:${UI_VERSION}"
      - name: Publish UI image
        if: steps.image-check.outcome == 'failure'
        run: make publish-ui-image
      - name: Push main alias tag (UI)
        run: |
          set -eu
          ALIAS="main"
          UI_VERSION="$(make -s version | awk '/^UI_VERSION:/ {print $2}')"
          # Ensure canonical tag is present locally (it may not be if image-check passed)
          docker pull "${REGISTRY}/${UI_IMAGE_NAME}:${UI_VERSION}"
          docker tag  "${REGISTRY}/${UI_IMAGE_NAME}:${UI_VERSION}" "${REGISTRY}/${UI_IMAGE_NAME}:${ALIAS}"
          docker push "${REGISTRY}/${UI_IMAGE_NAME}:${ALIAS}"

