name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_publish_target:
        description: 'Bootstrap-publish target (uses NPM_TOKEN; first publish only before OIDC trusted publishers are attached)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - contracts
          - events
          - chat-core
          - chat-server
          - chat-ui
          - auth-hono
          - auth-ui
          - flow
          - cowork-bridge
          - cowork-desktop
          - all

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

jobs:
  enforce-package-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version bump for packages with src changes
        run: |
          set -eu
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE" --depth=200 >/dev/null 2>&1
          MERGE_BASE="$(git merge-base "origin/$BASE" HEAD)"
          CHANGED="$(git diff --name-only "$MERGE_BASE" HEAD)"
          FAIL=""
          for pkg_dir in packages/*/; do
            [ -d "$pkg_dir" ] || continue
            pkg="$(basename "$pkg_dir")"
            # Skip if no src/ changes for this package in the PR diff
            if ! printf '%s\n' "$CHANGED" | grep -qE "^packages/${pkg}/src/"; then
              continue
            fi
            # Skip private packages (not published)
            is_private="$(node -p "JSON.parse(require('fs').readFileSync('packages/${pkg}/package.json','utf8')).private===true" 2>/dev/null || echo false)"
            if [ "$is_private" = "true" ]; then
              echo "::notice::packages/${pkg} is private — skipping bump check"
              continue
            fi
            OLD="$(git show "$MERGE_BASE:packages/${pkg}/package.json" 2>/dev/null | grep -m1 '"version"' | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/' || true)"
            NEW="$(grep -m1 '"version"' "packages/${pkg}/package.json" | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/')"
            # If OLD missing, package is new — bootstrap path covers it; skip
            if [ -z "$OLD" ]; then
              echo "::notice::packages/${pkg} appears new (no base version) — skipping bump check"
              continue
            fi
            if [ "$OLD" = "$NEW" ]; then
              echo "::error::packages/${pkg} has changes under src/ but version is unchanged ($OLD). Bump packages/${pkg}/package.json version (semver) before merging. See rules/workflow.md → Package publication."
              FAIL="$FAIL ${pkg}($OLD)"
            else
              echo "::notice::packages/${pkg}: $OLD -> $NEW ✓"
            fi
          done
          if [ -n "$FAIL" ]; then
            echo "::error::Missing version bumps:$FAIL"
            exit 1
          fi
          echo "All touched packages have bumped versions."

  changes:
    runs-on: ubuntu-latest
    outputs:
      global: ${{ steps.filter.outputs.global }}
      api: ${{ steps.filter.outputs.api }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      workers: ${{ steps.filter.outputs.workers }}
      ui: ${{ steps.filter.outputs.ui }}
      ai: ${{ steps.filter.outputs.ai }}
      llm_mesh: ${{ steps.filter.outputs.llm_mesh }}
      chat_ui: ${{ steps.filter.outputs.chat_ui }}
      cowork_bridge: ${{ steps.filter.outputs.cowork_bridge }}
      cowork_bridge_publish: ${{ steps.filter.outputs.cowork_bridge_publish }}
      cowork_desktop: ${{ steps.filter.outputs.cowork_desktop }}
      cowork_desktop_publish: ${{ steps.filter.outputs.cowork_desktop_publish }}
      auth_hono: ${{ steps.filter.outputs.auth_hono }}
      auth_ui: ${{ steps.filter.outputs.auth_ui }}
      chat_core: ${{ steps.filter.outputs.chat_core }}
      chat_server: ${{ steps.filter.outputs.chat_server }}
      events: ${{ steps.filter.outputs.events }}
      contracts: ${{ steps.filter.outputs.contracts }}
      flow: ${{ steps.filter.outputs.flow }}
      llm_mesh_publish: ${{ steps.filter.outputs.llm_mesh_publish }}
      chat_ui_publish: ${{ steps.filter.outputs.chat_ui_publish }}
      auth_hono_publish: ${{ steps.filter.outputs.auth_hono_publish }}
      auth_ui_publish: ${{ steps.filter.outputs.auth_ui_publish }}
      chat_core_publish: ${{ steps.filter.outputs.chat_core_publish }}
      chat_server_publish: ${{ steps.filter.outputs.chat_server_publish }}
      events_publish: ${{ steps.filter.outputs.events_publish }}
      contracts_publish: ${{ steps.filter.outputs.contracts_publish }}
      flow_publish: ${{ steps.filter.outputs.flow_publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            global:
              - 'Makefile'
              - 'docker-compose.yml'
              - 'docker-compose.test.yml'
              - '.github/workflows/ci.yml'
              - 'e2e/**'
            api:
              - 'api/**'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-mesh/**'
              - 'packages/flow/**'
              - 'packages/chat-server/**'
            ui:
              - 'ui/**'
            llm_mesh:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-mesh/**'
              - '.github/workflows/ci.yml'
            llm_mesh_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/llm-mesh/**'
            chat_ui:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-ui/**'
              - '.github/workflows/ci.yml'
            chat_ui_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-ui/**'
            cowork_bridge:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-bridge/**'
              - '.github/workflows/ci.yml'
            cowork_bridge_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-bridge/**'
            cowork_desktop:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-desktop/**'
              - 'packages/cowork-bridge/**'
              - 'packages/chat-ui/**'
              - '.github/workflows/ci.yml'
            cowork_desktop_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/cowork-desktop/**'
            auth_hono:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-hono/**'
              - '.github/workflows/ci.yml'
            auth_hono_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-hono/**'
            auth_ui:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-ui/**'
              - '.github/workflows/ci.yml'
            auth_ui_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/auth-ui/**'
            chat_core:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-core/**'
              - 'packages/events/**'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            chat_core_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-core/**'
            chat_server:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-server/**'
              - '.github/workflows/ci.yml'
            chat_server_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/chat-server/**'
            events:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/events/**'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            events_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/events/**'
            contracts:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/contracts/**'
              - '.github/workflows/ci.yml'
            contracts_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/contracts/**'
            flow:
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/flow/**'
              - '.github/workflows/ci.yml'
            flow_publish:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/flow/**'

  # Build E2E Docker image
  build-e2e:
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Check if E2E image is up to date
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        id: check-e2e-image
        run: make check-e2e-image
        continue-on-error: true
      - name: Build e2e image
        if: steps.check-e2e-image.outcome == 'failure' && (needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true')
        run: make build-e2e
      - name: Publish API image
        if: steps.check-e2e-image.outcome == 'failure' && (needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true')
        run: make publish-e2e-image

  typecheck-lint-ui:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Typecheck UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make typecheck-ui
      - name: Lint UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make lint-ui

  typecheck-lint-api:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Typecheck API
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make typecheck-api
      - name: Lint API
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make lint-api

  validate-llm-mesh:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.llm_mesh == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck LLM Mesh
        run: make typecheck-llm-mesh
      - name: Test LLM Mesh
        run: make test-llm-mesh
      - name: Build LLM Mesh
        run: make build-llm-mesh
      - name: Pack LLM Mesh
        run: make pack-llm-mesh

  validate-chat-ui:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.chat_ui == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Chat UI
        run: make typecheck-chat-ui
      - name: Test Chat UI
        run: make test-chat-ui
      - name: Build Chat UI
        run: make build-chat-ui
      - name: Pack Chat UI
        run: make pack-chat-ui

  validate-cowork-bridge:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.cowork_bridge == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Cowork Bridge
        run: make typecheck-cowork-bridge
      - name: Test Cowork Bridge
        run: make test-cowork-bridge
      - name: Build Cowork Bridge
        run: make build-cowork-bridge
      - name: Pack Cowork Bridge
        run: make pack-cowork-bridge

  validate-auth-hono:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.auth_hono == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Auth Hono
        run: make typecheck-auth-hono
      - name: Test Auth Hono
        run: make test-auth-hono
      - name: Build Auth Hono
        run: make build-auth-hono
      - name: Pack Auth Hono
        run: make pack-auth-hono

  validate-auth-ui:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.auth_ui == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Auth UI
        run: make typecheck-auth-ui
      - name: Test Auth UI
        run: make test-auth-ui
      - name: Build Auth UI
        run: make build-auth-ui
      - name: Pack Auth UI
        run: make pack-auth-ui

  validate-cowork-desktop:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.cowork_desktop == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Cowork Desktop
        run: make typecheck-cowork-desktop
      - name: Test Cowork Desktop
        run: make test-cowork-desktop
      - name: Build Cowork Desktop
        run: make build-cowork-desktop
      - name: Pack Cowork Desktop
        run: make pack-cowork-desktop

  validate-contracts:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Contracts
        run: make typecheck-contracts
      - name: Build Contracts
        run: make build-contracts
      - name: Pack Contracts
        run: make pack-contracts

  validate-events:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.events == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Events
        run: make typecheck-events
      - name: Build Events
        run: make build-events
      - name: Pack Events
        run: make pack-events

  validate-chat-core:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.chat_core == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Chat Core
        run: make typecheck-chat-core
      - name: Build Chat Core
        run: make build-chat-core
      - name: Pack Chat Core
        run: make pack-chat-core

  validate-chat-server:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.chat_server == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Chat Server
        run: make typecheck-chat-server
      - name: Test Chat Server
        run: make test-chat-server
      - name: Build Chat Server
        run: make build-chat-server
      - name: Pack Chat Server
        run: make pack-chat-server

  validate-flow:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.flow == 'true' || needs.changes.outputs.global == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Typecheck Flow
        run: make typecheck-flow
      - name: Build Flow
        run: make build-flow
      - name: Pack Flow
        run: make pack-flow

  # Build API Docker image (independent from API tests)
  build-api-image:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build API image
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make build-api
      - name: Save API image as artifact
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make save-api
      - name: Upload API image artifact
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: api-image
          path: api-image.tar

  test-api-unit-integration:
    runs-on: ubuntu-latest
    needs: [changes, build-api-image]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
          - suite: unit
          - suite: queue
          - suite: ai
            ai_specs: "chat-sync,executive-summary-auto,comment-assistant"
          - suite: ai
            ai_specs: "initiative-generation-async,executive-summary-sync"
          - suite: ai
            ai_specs: "chat-tools,company-enrichment-sync,documents-tool,initiative-generation-sync"
          - suite: security
          - suite: limit
          - suite: endpoints
            endpoints_shard: 1
          - suite: endpoints
            endpoints_shard: 2
          - suite: endpoints
            endpoints_shard: 3
          - suite: endpoints
            endpoints_shard: 4
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Download API image artifact
        uses: actions/download-artifact@v8
        with:
          name: api-image
          path: .
      - name: Load API image from artifact
        run: make load-api
      - name: Start API test stack
        run: make up-api-test-ci
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Test API (${{ matrix.suite }})
        run: |
          if [ "${{ matrix.suite }}" = "endpoints" ]; then
            make test-api-endpoints API_TEST_WORKERS=1 API_TEST_ARGS="--shard=${{ matrix.endpoints_shard }}/4"
          elif [ "${{ matrix.suite }}" = "ai" ] && [ -n "${{ matrix.ai_specs }}" ]; then
            SPECS=$(echo "${{ matrix.ai_specs }}" | tr ',' ' ' | xargs -I{} echo "tests/ai/{}.test.ts" | tr '\n' ' ')
            make test-api-ai SCOPE="$SPECS" API_TEST_WORKERS=1
          else
            make test-api-${{ matrix.suite }}
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Show API logs on failure
        if: failure()
        run: make logs-api

  # Build & Unit Test UI
  build-ui:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
      - name: Setup Docker
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build Chrome extension target
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make build-ext-chrome
      - name: Build VSCode extension target
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make build-ext-vscode
      - name: Build Cowork desktop binary
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make package-desktop-windows
      - name: Build UI image
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make build-ui-image
      - name: Save UI image as artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        run: make save-ui
      - name: Test UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make test-ui
      - name: Upload UI image artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-image
          path: ui-image.tar
      - name: Build UI
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        run: make build-ui
        env:
          VITE_API_BASE_URL: https://top-ai-ideas-api.sent-tech.ca/api/v1
      - name: Upload static files as artifact
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.global == 'true'
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: ui/build/

  test-e2e:
    runs-on: ubuntu-latest
    needs: [changes, typecheck-lint-ui, typecheck-lint-api, build-api-image, build-ui, build-e2e, security-sast-sca]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: group-a
            e2e_groups: "00 02 06"
          - group: group-b
            e2e_groups: "01 04"
          - group: group-c
            e2e_groups: "03"
          - group: group-d
            e2e_groups: "08"
          - group: group-e
            e2e_groups: "05 07"
    env:
      DOCKER_USERNAME: nologin
      DOCKER_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Pull if API image is up to date
        id: check-api-image
        run: make pull-api-image
        continue-on-error: true
      - name: Download API image artifact
        if: steps.check-api-image.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: api-image
          path: .
      - name: Load UI image from artifact
        if: steps.check-ui-image.outcome == 'failure'
        run: make load-ui
      - name: Pull if UI image is up to date
