  bootstrap-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_publish_target != 'none' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Write NPM_TOKEN to file
        run: |
          mkdir -p /tmp/sentropic-secrets
          printf '%s' "$NPM_TOKEN" > /tmp/sentropic-secrets/npm-token
          chmod 600 /tmp/sentropic-secrets/npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Bootstrap publish contracts
        if: inputs.bootstrap_publish_target == 'contracts' || inputs.bootstrap_publish_target == 'all'
        run: make publish-contracts-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish events
        if: inputs.bootstrap_publish_target == 'events' || inputs.bootstrap_publish_target == 'all'
        run: make publish-events-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
      - name: Bootstrap publish chat-core
        if: inputs.bootstrap_publish_target == 'chat-core' || inputs.bootstrap_publish_target == 'all'
        run: make publish-chat-core-token NPM_TOKEN_FILE=/tmp/sentropic-secrets/npm-token
