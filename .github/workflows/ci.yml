        run: make check-llm-model-equivalences
      - name: Typecheck LLM Mesh
        run: make typecheck-llm-mesh
      - name: Test LLM Mesh
        run: make test-llm-mesh
      - name: Build LLM Mesh
        run: make build-llm-mesh
      - name: Pack LLM Mesh
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make pack-llm-mesh ENV=test-ci-llm-mesh

  # The first package release uses bootstrap-publish. Enable steady-state OIDC
  # publication only after the npm trusted publisher has been attached.
  validate-cluster-mesh:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && !cancelled() && (needs.changes.outputs.cluster_mesh == 'true' || needs.changes.outputs.global == 'true')
    steps:
      - uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
      - name: Prepare and audit Cluster Mesh storage dependencies
        run: make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-storage-deps-audit ENV=test-ci-cluster-mesh
      - name: Prepare and audit the optional frozen comments peer
        run: make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-comments-deps-audit ENV=test-ci-cluster-mesh
      - name: Qualify Cluster Mesh Postgres storage and server recovery
        run: |
          make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-pg-test ENV=test-ci-cluster-mesh-pg
          make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-comments-test ENV=test-ci-cluster-mesh-pg
          make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-pg-crash-test ENV=test-ci-cluster-mesh-pg
      - name: Remove isolated Cluster Mesh Postgres service and volume
        if: always()
        run: make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-pg-down ENV=test-ci-cluster-mesh-pg
      - name: Lint Cluster Mesh
        run: make lint-cluster-mesh ENV=test-ci-cluster-mesh
      - name: Typecheck Cluster Mesh
        run: make typecheck-cluster-mesh ENV=test-ci-cluster-mesh
      - name: Test Cluster Mesh
        run: make test-cluster-mesh ENV=test-ci-cluster-mesh
      - name: Qualify installed stateful MCP contracts
        run: make cluster-mesh-workspace CM_ACTION=stateful-consumer ENV=test-cm-wrap
      - name: Build Cluster Mesh
        run: make build-cluster-mesh ENV=test-ci-cluster-mesh
      # Release train (BRDP-EX10): pack the candidate and its same-PR siblings first so the packed lazy
      # qualification resolves unpublished train siblings from their verified archives.
      - name: Pack Cluster Mesh
        id: pack
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make pack-cluster-mesh PACK_DESTINATION=tmp/ci-manifest-guard/candidate/cluster-mesh PACK_OUTPUT_FILE="$GITHUB_OUTPUT" ENV=test-ci-cluster-mesh
      - name: Pack Cluster Mesh same-PR BLOCK siblings
        # Prepare embedded dependencies before any installed candidate qualification.
        env:
          CI_MANIFEST_CONTEXT: ${{ toJSON(needs.changes.outputs) }}
          CI_MANIFEST_EVENT: ${{ github.event_name }}
          CI_MANIFEST_BOOTSTRAP_TARGET: ${{ inputs.bootstrap_publish_target || 'none' }}
        run: make pack-candidate-siblings PACKAGE=cluster-mesh SIBLING_DIR=tmp/ci-manifest-guard/siblings/cluster-mesh ENV=test-ci-cluster-mesh
      - name: Qualify installed comments on an injected single-session Postgres host
        env:
          CANDIDATE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-comments-installed CM_COMMENTS_TARBALL="$CANDIDATE_TARBALL" SIBLING_ARCHIVES_FILE=tmp/ci-manifest-guard/siblings/cluster-mesh/receipts.json CM_COMMENTS_REPORT=tmp/ci-manifest-guard/qualify-cluster-mesh/comments-installed ENV=test-ci-cluster-mesh-pg
      - name: Qualify PostgreSQL major upgrade re-attestation and retained cursor
        env:
          CANDIDATE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-pg-major-upgrade CM_COMMENTS_TARBALL="$CANDIDATE_TARBALL" SIBLING_ARCHIVES_FILE=tmp/ci-manifest-guard/siblings/cluster-mesh/receipts.json CM_COMMENTS_REPORT=tmp/ci-manifest-guard/qualify-cluster-mesh/major-upgrade ENV=test-ci-cluster-mesh-pg
      - name: Remove installed comments qualification Postgres service and volume
        if: always()
        run: make -f Makefile -f packages/cluster-mesh/tests/storage/postgres.mk cluster-mesh-pg-down ENV=test-ci-cluster-mesh-pg
      - name: Qualify packed Cluster Mesh (lazy surface release gate)
        run: |
          set -eu
          receipts=tmp/ci-manifest-guard/siblings/cluster-mesh/receipts.json
          if [ -f "$receipts" ]; then
            make -f packages/cluster-mesh/packaging.mk test-lazy-package SIBLING_ARCHIVES_FILE="$receipts" ENV=test
          else
            make -f packages/cluster-mesh/packaging.mk test-lazy-package ENV=test
          fi
      # Release train (BRDP-EX10): every leaf needs its optional peers (release-matrix tuple); a peer matching a
      # sibling receipt installs from that archive, the others from the registry (hono is a runtime dependency).
      - name: Qualify Cluster Mesh candidate install
        if: steps.pack.outputs.manifest_mode == 'block'
        env:
          CANDIDATE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: make qualify-published-install TARBALL="$CANDIDATE_TARBALL" SIBLING_ARCHIVES_FILE=tmp/ci-manifest-guard/siblings/cluster-mesh/receipts.json PEERS=@sentropic/llm-mesh@0.30.0,@sentropic/llm-gateway@0.21.5,@sentropic/mcp-auth@0.2.1,@sentropic/auth-hono@0.17.0,@sentropic/artifacts@0.2.0,jose@5.10.0,@sentropic/comments@0.3.1 REPORT_DIR=tmp/ci-manifest-guard/qualify-cluster-mesh ENV=test-ci-cluster-mesh
      - name: Upload Cluster Mesh candidate qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualify-cluster-mesh-candidate
          path: tmp/ci-manifest-guard/qualify-cluster-mesh/**
          retention-days: 7
          if-no-files-found: ignore

  # BR-LB-EX1 — @sentropic/llm-gateway (WP16 Layer-B) CI validation (owner-approved
  # 2026-06-22). Mirrors validate-llm-mesh; the make targets build the sibling
