name: hono-prod-hotfix

# One-shot hotfix: derive patched images FROM the exact production digests, replacing only
# @hono/node-server (GHSA-jpvv-r467-5p4w, GHSA-rmxm-3fg6-px4f). Runs on push to the hotfix branch (path-filtered)
# because a branch-only workflow cannot be dispatched. Deploy is NOT done here.
on:
  push:
    branches: [fix/hono-prod-hotfix]
    paths:
      - .github/workflows/hono-prod-hotfix.yml
      - scripts/security/hono-hotfix/**
      - scripts/security/hono-node-server.test.mjs

permissions:
  contents: read

env:
  PATCHED_VERSION: 2.1.6
  PATCHED_INTEGRITY: sha512-p/KH9MnfNcsm3sR6x4lNgm5j+QN4Et8srKredl9DZfXiyZ1UQ3aQ2YVpFLbqktYN5JI+DB+VZFKM2PqE5hLKjQ==
  IMAGE_REPO: ghcr.io/rhanka/sentropic-api

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: api
            base_digest: sha256:19b11b5baffe6b2e743ef6d5bb33e5fdb5ee78fe0e97573c51c37fa2d44e7ad7
          - role: idp
            base_digest: sha256:a36c6acaf9c887b4e96e54897f4d8f701456524a7c89976211786b680e543909
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch the patched package and verify its registry integrity
        run: |
          set -eu
          mkdir ctx
          curl -fsSL "https://registry.npmjs.org/@hono/node-server/-/node-server-${PATCHED_VERSION}.tgz" -o ctx/node-server.tgz
          got="sha512-$(openssl dgst -sha512 -binary ctx/node-server.tgz | base64 -w0)"
          [ "$got" = "$PATCHED_INTEGRITY" ] || { echo "integrity mismatch"; exit 1; }
          cp scripts/security/hono-hotfix/Dockerfile ctx/Dockerfile
      - name: Pull base and read its user
        run: |
          set -eu
          base="${IMAGE_REPO}@${{ matrix.base_digest }}"
          docker pull "$base"
          user="$(docker image inspect --format '{{.Config.User}}' "$base")"
          echo "ORIG_USER=${user:-root}" >> "$GITHUB_ENV"
      - name: Call-site audit on the unpatched base (2.x compatibility)
        run: |
          set -eu
          base="${IMAGE_REPO}@${{ matrix.base_digest }}"
          docker run --rm --entrypoint sh "$base" -c '
            cd /workspace/api
            echo "node: $(node -v)"
            echo "hono: $(node -p "require(\"hono/package.json\").version")"
            echo "dist files:"; ls dist | head -20
            echo "--- @hono/node-server references in dist (module specifiers):"
            grep -rhoE "[\"\x27]@hono/node-server[^\"\x27]*[\"\x27]" dist | sort | uniq -c
            echo "--- inlined markers (would mean the lib is bundled, not loaded from node_modules):"
            grep -rcE "function getRequestListener|var getRequestListener|createAdaptorServer =|serveStatic = " dist | grep -v ":0" || echo "none inlined"
            echo "--- usage lines:"
            grep -rnE "(serveStatic|getRequestListener|createAdaptorServer|[^a-zA-Z]serve)\(" dist --include=*.js | grep -vE "^\S+:[0-9]+:\s*//" | cut -c1-200 | head -30
            echo "--- source maps / src present:"; ls /workspace/api/src 2>/dev/null | head -3 || true
          '
      - name: Negative control, probe must FAIL on the unpatched base
        run: |
          set -eu
          base="${IMAGE_REPO}@${{ matrix.base_digest }}"
          if docker run --rm --entrypoint node -e HONO_TEST_ROOT=/workspace/api \
               -v "$PWD/scripts/security:/probe:ro" "$base" --test /probe/hono-node-server.test.mjs; then
            echo "probe passed on the vulnerable base: probe is not discriminating"; exit 1
          fi
          echo "negative control OK (probe fails on base)"
      - name: Build the derived image
        run: |
          set -eu
          docker build ctx \
            --build-arg BASE="${IMAGE_REPO}@${{ matrix.base_digest }}" \
            --build-arg BASE_REF="${IMAGE_REPO}@${{ matrix.base_digest }}" \
            --build-arg ORIG_USER="$ORIG_USER" \
            --build-arg SOURCE_REVISION="${{ github.sha }}" \
            -t "patched-${{ matrix.role }}"
      - name: Prove the installed tree inside the image
        run: |
          set -eu
          img="patched-${{ matrix.role }}"
          docker run --rm --entrypoint sh "$img" -c '
            set -eu
            find / -xdev -type d -path "*/node_modules/@hono/node-server" -prune -print > /tmp/f
            test "$(wc -l < /tmp/f)" = 1
            d="$(cat /tmp/f)"; echo "path: $d"
            test "$(node -p "require(\"$d/package.json\").version")" = "'"$PATCHED_VERSION"'"
            echo "version: $(node -p "require(\"$d/package.json\").version")"
            # npm is absent from the runtime image; resolve the module the way the app does.
            cd /workspace/api
            case "$(node -p "require.resolve(\"@hono/node-server\")")" in "$d"/*) ;; *) echo "resolves outside $d"; exit 1;; esac
            echo "resolves from /workspace/api: $(node -p "require.resolve(\"@hono/node-server\")")"
          '
          docker image inspect --format '{{json .Config.Labels}} user={{.Config.User}} entry={{.Config.Entrypoint}} cmd={{.Config.Cmd}} wd={{.Config.WorkingDir}}' "$img"
          base="${IMAGE_REPO}@${{ matrix.base_digest }}"
          for f in User Entrypoint Cmd WorkingDir Env; do
            a="$(docker image inspect --format "{{json .Config.$f}}" "$base")"; b="$(docker image inspect --format "{{json .Config.$f}}" "$img")"
            # an empty base User means root (uid 0); the derived image states it explicitly
            [ "$f" = User ] && [ "$a" = '""' ] && a='"root"'
            [ "$a" = "$b" ] || { echo "config drift on $f: $a vs $b"; exit 1; }
          done
          echo "runtime config identical to base"
      - name: Backslash regression probe against the patched image
        run: |
          set -eu
          docker run --rm --entrypoint node -e HONO_TEST_ROOT=/workspace/api \
            -v "$PWD/scripts/security:/probe:ro" "patched-${{ matrix.role }}" --test /probe/hono-node-server.test.mjs
      - name: Boot smoke, the image still starts its entrypoint
        run: |
          set -eu
          cid="$(docker run -d -e NODE_ENV=production "patched-${{ matrix.role }}")"
          sleep 8
          docker logs "$cid" 2>&1 | grep -E "\"[A-Za-z_0-9]+\"$|message|Error|listening|Listening|started" | cut -c1-160 | head -80 || true
          docker rm -f "$cid" >/dev/null
      - name: Push by tag and report the digest
        run: |
          set -eu
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="hono-${PATCHED_VERSION}-${{ matrix.role }}-${{ github.run_id }}"
          docker tag "patched-${{ matrix.role }}" "${IMAGE_REPO}:${tag}"
          docker push "${IMAGE_REPO}:${tag}" | tee push.log
          digest="$(grep -o 'digest: sha256:[0-9a-f]*' push.log | head -1 | cut -d' ' -f2)"
          echo "role=${{ matrix.role }} tag=${tag} digest=${digest} base=${{ matrix.base_digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
