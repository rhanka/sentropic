<svg xmlns="http://www.w3.org/2000/svg" class="architecture-svg scene-canvas" data-card-style="dossier" width="549.62744140625" height="1210.627197265625" viewBox="2786 808.3727416992188 549.62744140625 1210.627197265625" role="img" aria-labelledby="arrow-central-title arrow-central-desc" style="font-family:var(--st-font-sans,system-ui,sans-serif);color:var(--st-semantic-text-primary);fill:var(--st-semantic-text-primary)"><style>:root{--st-font-sans:Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;--st-semantic-text-primary:#0f172a;--st-semantic-surface-raised:#ffffff;--st-semantic-text-secondary:#475569;--st-semantic-feedback-info:#2563eb;--st-semantic-feedback-warning:#d97706;--st-semantic-surface-subtle:#f8fafc;--st-semantic-feedback-error:#dc2626;--st-semantic-feedback-success:#16a34a;--st-semantic-border-subtle:#e2e8f0;--st-typography-label-letterSpacing:0;--st-semantic-border-strong:#94a3b8;--st-semantic-data-category1:#4E79A7;--st-typography-field-size:1rem;--st-typography-label-lineHeight:1.4;--st-component-badge-fontWeight:650;}@media(prefers-color-scheme:dark){:root{--st-font-sans:Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;--st-semantic-text-primary:#f8fafc;--st-semantic-surface-raised:#1e293b;--st-semantic-text-secondary:#e2e8f0;--st-semantic-feedback-info:color-mix(in srgb, #2563eb 72%, #ffffff);--st-semantic-feedback-warning:color-mix(in srgb, #d97706 72%, #ffffff);--st-semantic-surface-subtle:#1e293b;--st-semantic-feedback-error:color-mix(in srgb, #dc2626 72%, #ffffff);--st-semantic-feedback-success:color-mix(in srgb, #16a34a 72%, #ffffff);--st-semantic-border-subtle:#475569;--st-typography-label-letterSpacing:0;--st-semantic-border-strong:color-mix(in srgb, #94a3b8 72%, #ffffff);--st-semantic-data-category1:#4E79A7;--st-typography-field-size:1rem;--st-typography-label-lineHeight:1.4;--st-component-badge-fontWeight:650;}}</style><title id="arrow-central-title">central</title><desc id="arrow-central-desc">h2a, Engram, Sentropic and Design System; CLI, Cowork, Cloud and AI provider access. Frames classify responsibilities; arrows follow the selected need.</desc><defs><marker id="arrow-central" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs><style>
    .architecture-svg { --diagram-surface:var(--st-semantic-surface-raised); --diagram-muted:color-mix(in srgb,var(--st-semantic-text-secondary) 75%,var(--st-semantic-text-primary)); --diagram-info:var(--st-semantic-feedback-info); --diagram-warning:var(--st-semantic-feedback-warning); background:color-mix(in srgb,var(--st-semantic-text-secondary) 8%,var(--st-semantic-surface-subtle)); }
    .architecture-svg [data-tone] { --diagram-tone:var(--st-semantic-text-secondary); --diagram-fill:color-mix(in srgb,var(--diagram-tone) 13%,var(--diagram-surface)); --diagram-border:color-mix(in srgb,var(--diagram-tone) 70%,var(--st-semantic-text-primary)); }
    .architecture-svg [data-tone="proposal"], .architecture-svg [data-tone="warning"] { --diagram-tone:var(--diagram-warning); }
    .architecture-svg [data-tone="identity"], .architecture-svg [data-tone="info"] { --diagram-tone:var(--diagram-info); }
    .architecture-svg [data-tone="critical"] { --diagram-tone:var(--st-semantic-feedback-error); }
    .architecture-svg [data-tone="positive"] { --diagram-tone:var(--st-semantic-feedback-success); }
    .architecture-svg .diagram-group-box { fill:color-mix(in srgb,var(--diagram-tone) 6%,var(--diagram-surface)); stroke:var(--diagram-border); }
    .architecture-svg .diagram-group-rule { stroke:var(--st-semantic-border-subtle); }
    .architecture-svg .diagram-card-box { fill:var(--diagram-fill); stroke:var(--diagram-border); }
    .architecture-svg .diagram-card-accent { stroke:var(--diagram-tone); }
    .architecture-svg .diagram-detail, .architecture-svg .diagram-kicker { fill:var(--diagram-muted); }
    .architecture-svg .diagram-kicker { letter-spacing:var(--st-typography-label-letterSpacing); }
    .architecture-svg .icon-base { fill:color-mix(in srgb,var(--diagram-info) 18%,var(--diagram-surface)); }
    .architecture-svg .icon-face { fill:color-mix(in srgb,var(--diagram-info) 75%,var(--diagram-surface)); stroke:var(--diagram-info); stroke-width:1.5; stroke-linejoin:round; }
    .architecture-svg .icon-line { fill:none; stroke:var(--diagram-surface); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .architecture-svg .icon-line.dark { stroke:var(--diagram-info); }
    .architecture-svg .diagram-status circle { fill:var(--diagram-surface); stroke:var(--diagram-warning); stroke-width:1.5; stroke-dasharray:3 2; }
    .architecture-svg .diagram-status path { fill:none; stroke:var(--diagram-warning); stroke-width:2; stroke-linecap:round; }
    .architecture-svg [data-group-toggle] { color:var(--st-semantic-text-primary); }
    .architecture-svg [data-group-toggle]:hover .frame-control-face, .architecture-svg [data-group-toggle]:focus-visible .frame-control-face { fill:var(--st-semantic-surface-subtle); }
    .architecture-svg [data-group-toggle]:focus-visible { outline:2px solid var(--diagram-info); outline-offset:2px; }
    .architecture-svg .diagram-edge-pill rect { fill:var(--st-semantic-surface-subtle); stroke:var(--st-semantic-text-secondary); stroke-width:1; }
    .architecture-svg .diagram-edge-pill text { fill:var(--st-semantic-text-primary); }
    .architecture-svg[data-card-style="dossier"] .diagram-group-box { rx:0; }
    
.scene-canvas .service-name, .scene-canvas .service-node .repo-label { font-family: var(--st-font-sans); }
.scene-canvas .service-node { width: 100%; height: 100%; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; overflow: hidden; border: 2px solid var(--st-semantic-border-strong); border-left: 8px solid var(--st-semantic-data-category1); background: var(--st-semantic-surface-raised); color: var(--st-semantic-text-primary); text-align: left; }
.scene-canvas .service-node header { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 0 auto; }
.scene-canvas .card-head { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1 1 auto; }
.scene-canvas .card-code, .scene-canvas .card-name, .scene-canvas .card-detail, .scene-canvas .service-node .repo-label, .scene-canvas .service-name { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scene-canvas .card-code { font-size: var(--st-typography-field-size); line-height: var(--st-typography-label-lineHeight); color: var(--diagram-muted); letter-spacing: var(--st-typography-label-letterSpacing); }
.scene-canvas .service-name { font-size: var(--st-typography-field-size); line-height: var(--st-typography-label-lineHeight); font-weight: var(--st-component-badge-fontWeight); }
.scene-canvas .card-gap { display: block; height: 6px; flex: 0 0 6px; }
.scene-canvas .card-name, .scene-canvas .card-detail { font-size: var(--st-typography-field-size); line-height: var(--st-typography-label-lineHeight); }
.scene-canvas .card-detail { color: var(--diagram-muted); }
.scene-canvas .card-rule { display: block; height: 1px; flex: 0 0 1px; margin: 4px 0; background: var(--st-semantic-border-subtle); }
.scene-canvas .service-node .repo-label { font-size: var(--st-typography-field-size); line-height: var(--st-typography-label-lineHeight); }
.scene-canvas .service-node.card-tier-service { width:460px; }
/* Owner additions: tinted fills, contrast-qualified border, two extra pixels
   below the icon, explicit wrapping rather than hidden content. */
.scene-canvas .service-node { background: var(--diagram-fill); border-color: var(--diagram-border); border-left-color: var(--diagram-border); justify-content: center; }
.scene-canvas .service-node header &gt; svg { flex: 0 0 70px; }
.scene-canvas .service-node .card-name, .scene-canvas .service-node .card-detail, .scene-canvas .service-node .card-rule, .scene-canvas .service-node .repo-label { margin-left: 2px; }
.scene-canvas .service-node .service-name, .scene-canvas .service-node .card-name, .scene-canvas .service-node .card-detail, .scene-canvas .service-node .repo-label { white-space: normal; flex-shrink: 0; text-overflow: clip; }
.scene-canvas .service-node .repo-label { font-weight: var(--st-component-badge-fontWeight); }

