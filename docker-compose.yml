services:
  api:
    image: ${REGISTRY}/${API_IMAGE_NAME:-top-ai-ideas-api}:${API_VERSION:-latest}
    build:
      context: .
      dockerfile: ./api/Dockerfile
      target: ${TARGET:-development}
    working_dir: /workspace/api
    environment:
      - NODE_ENV=${TARGET:-development}
      - DATABASE_URL=${DATABASE_URL:-postgres://app:app@postgres:5432/app}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # GCP (Gemini-on-GCP / Model Garden) — native passthrough like GEMINI_API_KEY.
      # project/location are plain config; the bearer is minted server-side from ADC.
      # GOOGLE_APPLICATION_CREDENTIALS points at the gitignored SA-key file mounted
      # via the workspace bind-mount in docker-compose.dev.yml (default below). Absent
      # any of these the `gcp` provider stays unavailable and never crashes startup.
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:${UI_PORT:-5173},http://127.0.0.1:${UI_PORT:-5173},http://ui:5173,https://*.sent-tech.ca,chrome-extension://*,vscode-webview://*}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT}
      - DISABLE_AUTH=${DISABLE_AUTH:-0}
      # Outbound email via the Scaleway TEM HTTP API. In dev the api targets the
      # local scw-tem-mock service, which forwards to maildev over SMTP.
      - SCW_TEM_API_BASE_URL=${SCW_TEM_API_BASE_URL:-http://scw-tem-mock:7700}
      - SCW_TEM_REGION=${SCW_TEM_REGION:-fr-par}
      - SCW_TEM_PROJECT_ID=${SCW_TEM_PROJECT_ID:-dev-mock-project}
      - SCW_TEM_SECRET_KEY=${SCW_TEM_SECRET_KEY:-dev-mock-token}
      - SCW_TEM_FROM_EMAIL=${SCW_TEM_FROM_EMAIL:-no-reply@sent-tech.ca}
      - SCW_TEM_FROM_NAME=${SCW_TEM_FROM_NAME:-Sentropic}
      - AUTH_CALLBACK_BASE_URL=${AUTH_CALLBACK_BASE_URL}
      - GOOGLE_DRIVE_CLIENT_ID=${GOOGLE_DRIVE_CLIENT_ID}
      - GOOGLE_DRIVE_CLIENT_SECRET=${GOOGLE_DRIVE_CLIENT_SECRET}
      - GOOGLE_DRIVE_AUTH_CALLBACK_BASE_URL=${GOOGLE_DRIVE_AUTH_CALLBACK_BASE_URL}
      - GOOGLE_DRIVE_PICKER_API_KEY=${GOOGLE_DRIVE_PICKER_API_KEY}
      - GOOGLE_DRIVE_PICKER_APP_ID=${GOOGLE_DRIVE_PICKER_APP_ID}
      # Chat tracing (dev: enabled by default, can be overridden)
      - CHAT_TRACE_ENABLED=${CHAT_TRACE_ENABLED:-true}
      - CHAT_TRACE_RETENTION_DAYS=${CHAT_TRACE_RETENTION_DAYS:-7}
    ports:
      - "${API_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_started
      scw-tem-mock:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    tty: true

  ui:
    image: ${REGISTRY}/${UI_IMAGE_NAME:-top-ai-ideas-ui}:${UI_VERSION:-latest}
    build:
      context: .
      dockerfile: ./ui/Dockerfile
      target: ${TARGET:-development}
    working_dir: /workspace/ui
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:${API_PORT:-8787}/api/v1}
      - VITE_EXTENSION_PROFILE=${VITE_EXTENSION_PROFILE:-uat}
      - VITE_EXTENSION_API_BASE_URL=${VITE_EXTENSION_API_BASE_URL:-http://localhost:${API_PORT:-8787}/api/v1}
      - VITE_EXTENSION_APP_BASE_URL=${VITE_EXTENSION_APP_BASE_URL:-http://localhost:${UI_PORT:-5173}}
      - VITE_EXTENSION_WS_BASE_URL=${VITE_EXTENSION_WS_BASE_URL:-}
    ports:
      - "${UI_PORT:-5173}:5173"
    tty: true

  # sqlite/litestream removed after migration to Postgres

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
    # Internal only; no host port publish needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  maildev:
    image: maildev/maildev:2.0.5
    ports:
      - "${MAILDEV_UI_PORT:-1080}:1080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1080 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only mock of the Scaleway TEM HTTP API; forwards each accepted payload
  # to maildev over SMTP so outgoing mail stays visible in the maildev UI.
  scw-tem-mock:
    build: ./tools/scw-tem-mock
    environment:
      - MAILDEV_HOST=maildev
      - MAILDEV_SMTP_PORT=1025
    depends_on:
      maildev:
        condition: service_started

volumes:
  pg_data:
