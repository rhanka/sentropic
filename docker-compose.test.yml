services:
  api:
    user: "${API_UID:-1000}:${API_UID:-1000}"
    environment:
      - DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT:-true}
      # BR70-CI1: the test api runs NODE_ENV=development, so its background outbox
      # dispatcher would race + pre-empt the explicit-dispatch outbox unit tests.
      # Suppress the autostart here; the outbox tests drive the dispatcher directly.
      - OUTBOX_DISPATCHER_AUTOSTART=false
      - ADMIN_EMAIL=e2e-admin@example.com
      - LOCK_TTL_MS=15000  # 15s for E2E tests (default: 60s)
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_ORIGIN=http://localhost:${UI_PORT:-5173}
      # Document storage (CI/E2E): MinIO
      - DOC_STORAGE_ENDPOINT=${DOC_STORAGE_ENDPOINT:-http://minio:9000}
      - DOC_STORAGE_REGION=${DOC_STORAGE_REGION:-fr-par-1}
      - DOC_STORAGE_BUCKET=${DOC_STORAGE_BUCKET:-sentropic-docs-test}
      # IMPORTANT: avoid leaking real Scaleway creds from host env into test MinIO.
      - DOC_STORAGE_ACCESS_KEY=${DOC_STORAGE_ACCESS_KEY:-minioadmin}
      - DOC_STORAGE_SECRET_KEY=${DOC_STORAGE_SECRET_KEY:-minioadmin}
      - H2A_NATIVE_SOCKET=${H2A_NATIVE_SOCKET:-}
      - H2A_ROOT=${H2A_ROOT:-}
      - CLUSTER_MESH_A1_EVIDENCE=${CLUSTER_MESH_A1_EVIDENCE:-}
      - CLUSTER_MESH_A1_TARGET_REGISTRATION=${CLUSTER_MESH_A1_TARGET_REGISTRATION:-}
      - CLUSTER_MESH_A1_TARGET_TICK_URL=${CLUSTER_MESH_A1_TARGET_TICK_URL:-}
      - CLUSTER_MESH_A1_PARK_TARGET_URL=${CLUSTER_MESH_A1_PARK_TARGET_URL:-}
      - CLUSTER_MESH_A1_LOST_STATUS_URL=${CLUSTER_MESH_A1_LOST_STATUS_URL:-}
      - CLUSTER_MESH_MCP_QUALIFICATION_URL=${CLUSTER_MESH_MCP_QUALIFICATION_URL:-}
      - CLUSTER_MESH_CLI_QUALIFICATION_URL=${CLUSTER_MESH_CLI_QUALIFICATION_URL:-}
      - CLUSTER_MESH_CAPACITY_QUALIFICATION_URL=${CLUSTER_MESH_CAPACITY_QUALIFICATION_URL:-}
    volumes:
      - ${H2A_NATIVE_SOCKET:-/tmp/sentropic-h2a-disabled.sock}:${H2A_NATIVE_SOCKET:-/tmp/sentropic-h2a-disabled.sock}:rw
      - ${H2A_ROOT:-/tmp/sentropic-h2a-disabled-root}:${H2A_ROOT:-/tmp/sentropic-h2a-disabled-root}:rw
  e2e:
    network_mode: host
    image: ${REGISTRY}/${E2E_IMAGE_NAME:-sentropic-e2e}:${E2E_VERSION:-latest}
    build:
      context: ./e2e
      dockerfile: Dockerfile
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://localhost:${API_PORT:-8787}}
      - UI_BASE_URL=${UI_BASE_URL:-http://localhost:${UI_PORT:-5173}}
      - MAILDEV_API_URL=${MAILDEV_API_URL:-http://localhost:${MAILDEV_UI_PORT:-1080}}
      - CLUSTER_MESH_A1_EVIDENCE=${CLUSTER_MESH_A1_EVIDENCE:-}
      - CLUSTER_MESH_A1_TARGET_REGISTRATION=${CLUSTER_MESH_A1_TARGET_REGISTRATION:-}
      - CLUSTER_MESH_A1_TARGET_TICK_URL=${CLUSTER_MESH_A1_TARGET_TICK_URL:-}
      - CLUSTER_MESH_A1_PARK_TARGET_URL=${CLUSTER_MESH_A1_PARK_TARGET_URL:-}
      - CLUSTER_MESH_A1_LOST_STATUS_URL=${CLUSTER_MESH_A1_LOST_STATUS_URL:-}
      - CLUSTER_MESH_MCP_QUALIFICATION_URL=${CLUSTER_MESH_MCP_QUALIFICATION_URL:-}
      - CLUSTER_MESH_CLI_QUALIFICATION_URL=${CLUSTER_MESH_CLI_QUALIFICATION_URL:-}
      - CLUSTER_MESH_CAPACITY_QUALIFICATION_URL=${CLUSTER_MESH_CAPACITY_QUALIFICATION_URL:-}
    volumes:
      - ./e2e/tests:/app/tests
      - ./e2e/helpers:/app/helpers
      - ./e2e/.auth:/app/.auth
      - ./e2e/test-results:/app/test-results
    depends_on:
      - postgres
      - api
      - ui
    command: sleep 1800

  ui:
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}

  minio-init:
    image: minio/mc:latest
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo "waiting for minio..." && sleep 1;
      done;
      mc mb --ignore-existing local/${DOC_STORAGE_BUCKET:-sentropic-docs-test} || true;
      mc anonymous set none local/${DOC_STORAGE_BUCKET:-sentropic-docs-test} || true;
      exit 0
    restart: "no"
