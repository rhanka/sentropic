# Isolated compose project for the generated app.
# Project name = the app slug so two scaffolded apps (or the monorepo dev stack)
# never collide. Ports come from .env and are NEVER the monorepo reserved
# 8787/5173/1080.
name: {{slug}}

services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm install --no-audit --no-fund && npm run dev"
    environment:
      - PORT=${API_PORT:-{{api_port}}}
      - PROVIDER=${PROVIDER:-{{provider}}}
    ports:
      - "${API_PORT:-{{api_port}}}:{{api_port}}"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

  ui:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port {{ui_port}}"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:{{api_port}}}
    ports:
      - "${UI_PORT:-{{ui_port}}}:{{ui_port}}"
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  api_node_modules:
  ui_node_modules:
